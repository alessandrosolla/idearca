<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linea del tempo — Idearca</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1c2b1a;--stone:#5a6b58;--stone-light:#8a9e87;
  --cream:#faf8f3;--surface:#edf2eb;--white:#fff;
  --border:rgba(45,90,39,.14);
  --storia:#2d5a27;--filosofia:#9a7c2e;
}
body{font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
  background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:2.6rem 2rem 5rem}

.kicker{font-size:.63rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone-light);font-weight:600}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.8rem;font-weight:400;margin:.4rem 0 .7rem;line-height:1.05}
.sub{font-size:.95rem;line-height:1.8;color:var(--stone);font-weight:300;max-width:66ch}

/* ── i comandi ── */
.barra{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);margin:2rem -2rem 0;padding:.9rem 2rem;
  display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.filtro{font:inherit;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;
  padding:.45rem .95rem;border-radius:100px;border:1.4px solid var(--border);
  background:var(--white);color:var(--stone);cursor:pointer;transition:all .2s}
.filtro:hover{border-color:var(--stone-light);color:var(--ink)}
.filtro.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.filtro.on[data-m="s"]{background:var(--storia);border-color:var(--storia)}
.filtro.on[data-m="f"]{background:var(--filosofia);border-color:var(--filosofia)}
.sep{width:1px;height:22px;background:var(--border);margin:0 .35rem}
.conteggio{margin-left:auto;font-size:.7rem;color:var(--stone-light)}

/* ── l'asse ── */
.tempo{position:relative;margin-top:2.4rem;padding-bottom:2rem}
.tempo::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;
  transform:translateX(-50%);background:linear-gradient(to bottom,transparent,var(--border) 4%,var(--border) 96%,transparent)}

.era{position:relative;text-align:center;margin:2.6rem 0 1.8rem;z-index:2}
.era span{display:inline-block;background:var(--cream);padding:.3rem 1.1rem;
  font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone-light);font-weight:600;
  border:1px solid var(--border);border-radius:100px}

.riga{position:relative;display:grid;grid-template-columns:1fr 88px 1fr;
  align-items:start;margin-bottom:.9rem}
.riga .vuoto{}
.anno{grid-column:2;justify-self:center;position:relative;z-index:3;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:.9rem;font-weight:600;
  background:var(--cream);padding:.28rem 0;width:100%;text-align:center;color:var(--stone)}
.card{border:1px solid var(--border);border-radius:12px;padding:.95rem 1.15rem;
  background:var(--white);position:relative;
  transition:transform .22s,box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(28,43,26,.09)}
.riga.s .card{grid-column:1;border-left:3px solid var(--storia);margin-right:.6rem}
.riga.f .card{grid-column:3;border-right:3px solid var(--filosofia);margin-left:.6rem;text-align:right}
.riga.s .anno{color:var(--storia)}
.riga.f .anno{color:var(--filosofia)}
.card b{display:block;font-size:.93rem;font-weight:500;line-height:1.35;margin-bottom:.3rem}
.card p{font-size:.79rem;line-height:1.65;color:var(--stone);font-weight:300}
.tag{display:inline-block;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;margin-bottom:.35rem}
.riga.s .tag{color:var(--storia)}
.riga.f .tag{color:var(--filosofia)}
/* il puntino sull'asse */
.riga::after{content:'';position:absolute;left:50%;top:.62rem;width:9px;height:9px;
  border-radius:50%;transform:translateX(-50%);z-index:4;border:2px solid var(--cream)}
.riga.s::after{background:var(--storia)}
.riga.f::after{background:var(--filosofia)}

.vuoto-msg{text-align:center;color:var(--stone);font-size:.9rem;padding:4rem 1rem}

@media(max-width:820px){
  .wrap{padding:1.8rem 1.1rem 4rem}
  h1{font-size:2.1rem}
  .barra{margin:1.4rem -1.1rem 0;padding:.8rem 1.1rem}
  .conteggio{width:100%;margin:.3rem 0 0}
  .tempo::before{left:9px}
  .riga{grid-template-columns:26px 1fr;gap:0}
  .riga .anno{grid-column:2;justify-self:start;text-align:left;padding:0 0 .2rem;width:auto;background:none}
  .riga.s .card,.riga.f .card{grid-column:2;margin:0 0 .2rem;text-align:left;
    border-left:3px solid var(--storia);border-right:1px solid var(--border)}
  .riga.f .card{border-left-color:var(--filosofia)}
  .riga::after{left:9px;top:.35rem}
  .era{text-align:left;padding-left:26px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="kicker">Idearca · Didattica</div>
  <h1>Linea del tempo</h1>
  <p class="sub">Gli snodi che compaiono nelle slide, messi uno accanto all'altro.
  A sinistra quello che accadeva, a destra quello che si pensava: si vede subito
  che le idee non nascono in una stanza vuota.</p>

  <div class="barra">
    <button class="filtro on" data-m="tutto" onclick="filtra('tutto')">Tutto</button>
    <button class="filtro" data-m="s" onclick="filtra('s')">Storia</button>
    <button class="filtro" data-m="f" onclick="filtra('f')">Filosofia</button>
    <span class="sep"></span>
    <button class="filtro on" data-e="tutte" onclick="periodo('tutte')">Ogni epoca</button>
    <button class="filtro" data-e="antica" onclick="periodo('antica')">Antica</button>
    <button class="filtro" data-e="medievale" onclick="periodo('medievale')">Medievale</button>
    <button class="filtro" data-e="moderna" onclick="periodo('moderna')">Moderna</button>
    <button class="filtro" data-e="contemporanea" onclick="periodo('contemporanea')">Contemporanea</button>
    <span class="conteggio" id="conteggio"></span>
  </div>

  <div class="tempo" id="tempo"></div>
</div>

<script src="eventi.js"></script>
<script>
/* Le quattro epoche del programma, con i loro confini.
   Servono sia a raggruppare sia a filtrare. */
const EPOCHE=[
  {id:'antica',        l:'Mondo antico',            da:-4000, a:475},
  {id:'medievale',     l:'Medioevo',                da:476,   a:1491},
  {id:'moderna',       l:'Età moderna',             da:1492,  a:1814},
  {id:'contemporanea', l:'Età contemporanea',       da:1815,  a:3000}
];
const NOMI={s:'Storia', f:'Filosofia'};

let mSel='tutto', eSel='tutte';

function annoScritto(a){
  return a<0 ? Math.abs(a)+' a.C.' : String(a);
}
function epocaDi(a){
  return EPOCHE.find(e=>a>=e.da&&a<=e.a) || EPOCHE[EPOCHE.length-1];
}

function disegna(){
  const scelti=EVENTI
    .filter(ev=>mSel==='tutto'||ev.m===mSel)
    .filter(ev=>eSel==='tutte'||epocaDi(ev.a).id===eSel)
    .sort((x,y)=>x.a-y.a);

  const box=document.getElementById('tempo');
  document.getElementById('conteggio').textContent =
    scelti.length ? scelti.length+' event'+(scelti.length===1?'o':'i') : '';

  if(!scelti.length){
    box.innerHTML='<p class="vuoto-msg">Nessun evento con questi filtri.</p>';
    return;
  }

  let html='', epocaCorrente='';
  scelti.forEach(ev=>{
    const ep=epocaDi(ev.a);
    if(ep.id!==epocaCorrente){
      epocaCorrente=ep.id;
      html+='<div class="era"><span>'+ep.l+'</span></div>';
    }
    html+='<div class="riga '+ev.m+'">'
      + '<div class="anno">'+annoScritto(ev.a)+'</div>'
      + '<div class="card"><span class="tag">'+NOMI[ev.m]+'</span>'
      + '<b>'+ev.t+'</b><p>'+ev.d+'</p></div>'
      + '</div>';
  });
  box.innerHTML=html;
}

function filtra(m){
  mSel=m;
  document.querySelectorAll('.filtro[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  disegna();
}
function periodo(e){
  eSel=e;
  document.querySelectorAll('.filtro[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e===e));
  disegna();
}

disegna();
</script>
</body>
</html>
