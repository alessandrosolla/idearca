<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lavagna — Idearca</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;
    /* niente rimbalzo dello scorrimento e niente pizzico sulla
       pagina: a schermo intero sono le due cose che fanno uscire */
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}
  #testo{-webkit-user-select:text;user-select:text}
  body{
    background:#FBF7F0;color:#1F1B16;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- barra degli strumenti ---------- */
  .bar{
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    padding:.4rem .7rem;background:#fff;border-bottom:1px solid #E3DACB;
    flex:0 0 auto;
  }
  .bar button{
    font:inherit;font-size:.9rem;font-weight:600;
    min-height:44px;min-width:44px;
    padding:.5rem .8rem;border:1px solid #E3DACB;border-radius:9px;
    background:#fff;color:#1F1B16;cursor:pointer;line-height:1.2;
    touch-action:manipulation;
  }
  .bar button:hover{border-color:#8A7355}
  .bar button.on{background:#1F1B16;color:#fff;border-color:#1F1B16}
  .sep{width:1px;height:32px;background:#E3DACB;margin:0 .1rem}
  /* Con dieci colori i pastelli occupavano mezza barra: si
     stringono un po' e restano comunque bersagli da dito. */
  .colore{
    width:34px;height:34px;min-width:34px;border-radius:50%;
    border:3px solid #fff;box-shadow:0 0 0 1px #C9BCA6;cursor:pointer;padding:0;
  }
  .colore.on{box-shadow:0 0 0 3px #1F1B16;transform:scale(1.12)}
  .colore{transition:transform .12s}
  .sp{width:44px;height:44px;padding:0!important;display:grid;place-items:center}
  .sp i{display:block;background:#1F1B16;border-radius:99px}
  .spazio{flex:1}
  .zoom{font-variant-numeric:tabular-nums;min-width:4.2rem;text-align:center;
        font-size:.85rem;color:#5A5148;font-weight:600}
  .stato{font-size:.78rem;color:#5A5148;min-width:7rem;text-align:right}

  /* ---------- la tela infinita ---------- */
  .area{position:relative;flex:1 1 auto;overflow:hidden;background:#FBF7F0}
  /* Il testo vive nello stesso spazio del disegno: si sposta e si
     ingrandisce insieme a esso, quindi resta sempre allineato. */
  #testo{
    position:absolute;left:0;top:0;width:1100px;min-height:640px;
    transform-origin:0 0;padding:2rem 2.4rem;margin:0;
    font-size:30px;line-height:1.5;outline:none;
    white-space:pre-wrap;word-wrap:break-word;
  }
  #testo:empty::before{
    content:"Scrivi qui. Con due dita, o con la rotellina, ti sposti e ingrandisci quanto vuoi.";
    color:#B9AE9C;
  }
  #tela{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  body.modo-testo #tela{pointer-events:none}
  body.modo-disegno #testo{pointer-events:none;user-select:none}
  body.modo-mano #tela{cursor:grab}
  body.modo-mano.trascina #tela{cursor:grabbing}
  /* mentre si sta tirando il rettangolo della gomma */
  body.seleziona #tela{cursor:crosshair}

  @media (max-width:980px){
    .bar{gap:.3rem;padding:.35rem .45rem}
    .bar button{padding:.5rem .55rem;font-size:0}
    .bar button::first-letter{font-size:1.35rem}
    .colore,.sp{font-size:0}
    .zoom{font-size:.78rem;min-width:3.4rem}
    .stato{display:none}
  }
  /* il nastro degli avvisi: non riceve puntatori, quindi non
     puo' rubare un tratto ne' far uscire da schermo intero */
  #nastro{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(1rem);
    background:#1F1B16;color:#fff;font-size:.85rem;line-height:1.4;
    padding:.7rem 1.1rem;border-radius:11px;max-width:min(92vw,34rem);
    box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;
    opacity:0;transition:opacity .2s,transform .2s;z-index:90}
  #nastro.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media print{.bar{display:none}}
</style>
</head>
<body class="modo-testo">

<div class="bar">
  <button id="b-testo" class="on" onclick="modo('testo')">✏️ Testo</button>

  <span class="sep"></span>

  <button class="colore" data-c="#9A7C2E" style="background:#9A7C2E" title="Oro"></button>
  <button class="colore" data-c="#2D7A2B" style="background:#2D7A2B" title="Verde"></button>
  <button class="colore" data-c="#1C8C8C" style="background:#1C8C8C" title="Verde acqua"></button>
  <button class="colore" data-c="#2C6FB5" style="background:#2C6FB5" title="Blu"></button>
  <button class="colore" data-c="#7A4B8C" style="background:#7A4B8C" title="Viola"></button>

  <button class="sp" data-w="4"  title="Tratto sottile"><i style="width:16px;height:4px"></i></button>
  <button class="sp on" data-w="8"  title="Tratto medio"><i style="width:16px;height:8px"></i></button>
  <button class="sp" data-w="14" title="Tratto spesso"><i style="width:16px;height:13px"></i></button>

  <span class="sep"></span>
  <button id="b-raddrizza" onclick="commutaRaddrizza()" title="Le figure tracciate a mano libera diventano linee, rettangoli, cerchi">⊹ Raddrizza</button>
  <button id="b-freccia" onclick="commutaFreccia()" title="Aggiunge la punta in fondo alle linee dritte">→ Freccia</button>

  <span class="sep"></span>
  <button onclick="zoomPasso(1/1.25)" title="Rimpicciolisci">−</button>
  <span class="zoom" id="zoom-etichetta">100%</span>

  <span class="sep"></span>
  <button onclick="annulla()">↶ Annulla</button>
  <button onclick="pulisci()">Pulisci</button>
  <button id="b-palmo" onclick="palmo()" title="Ignora il dito, accetta solo la penna">✋ Solo penna</button>
  <button id="b-pieno" onclick="schermoIntero()">⛶ Schermo intero</button>

  <span class="spazio"></span>
  <span class="stato" id="stato"></span>
  <button onclick="archivia()" style="background:#1F1B16;color:#fff;border-color:#1F1B16">Archivia</button>
</div>

<div class="area" id="area">
  <div id="testo" contenteditable="true" spellcheck="false"></div>
  <canvas id="tela"></canvas>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   LAVAGNA — Idearca
   Tela infinita. I tratti si salvano in coordinate del "mondo",
   indipendenti dallo schermo: si può ingrandire senza limiti e
   restano nitidi, perché a ogni cambio di vista si ridisegnano
   invece di ingrandire pixel già stampati.
   ══════════════════════════════════════════════════════════ */

const SB_URL = 'https://mqjceddrbhpwqjomhohm.supabase.co';
const SB_KEY = 'sb_publishable_D7vDsaervKNJNgdJwknDpQ_Vuuf9CeJ';

const elArea  = document.getElementById('area');
const tela    = document.getElementById('tela');
const ctx     = tela.getContext('2d');
const elTesto = document.getElementById('testo');
const elStato = document.getElementById('stato');
const elZoom  = document.getElementById('zoom-etichetta');

let tratti  = [];               // [{c, w, p:[[x,y],…]}] in coordinate del mondo
let inCorso = null;
let colore  = '#1F1B16';
let spessore = 8;
let modoAttuale = 'testo';
let soloPenna = false;
let dim = {w:0, h:0};

/* vista: quale porzione di mondo si sta guardando.
   schermo = mondo * s + (x,y) */
let vista = {x:0, y:0, s:1};
const S_MIN = 0.02, S_MAX = 64;

/* ---------- dimensionamento ---------- */
function ridimensiona(){
  const r = elArea.getBoundingClientRect();
  if(r.width === 0 || r.height === 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  dim = {w:r.width, h:r.height};
  tela.style.width  = r.width + 'px';
  tela.style.height = r.height + 'px';
  tela.width  = Math.round(r.width  * dpr);
  tela.height = Math.round(r.height * dpr);
  ridisegna();
}
window.addEventListener('resize', ridimensiona);
document.addEventListener('fullscreenchange', ()=>setTimeout(ridimensiona,60));
document.addEventListener('webkitfullscreenchange', ()=>setTimeout(ridimensiona,60));

/* ---------- conversioni ---------- */
function aMondo(clientX, clientY){
  const r = tela.getBoundingClientRect();
  return [ (clientX - r.left - vista.x) / vista.s,
           (clientY - r.top  - vista.y) / vista.s ];
}

function applicaVista(){
  elTesto.style.transform = 'translate(' + vista.x + 'px,' + vista.y + 'px) scale(' + vista.s + ')';
  elZoom.textContent = Math.round(vista.s * 100) + '%';
}

/* ---------- disegno ---------- */
function preparaContesto(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr*vista.s, 0, 0, dpr*vista.s, dpr*vista.x, dpr*vista.y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function ridisegna(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,dim.w,dim.h);
  preparaContesto();
  for(const t of tratti) disegnaTratto(t);
  disegnaSelezione();
  applicaVista();
}

/* Il rettangolo di selezione e i tratti che ha preso: si vede
   che cosa sparirà prima di lasciare il dito. */
function disegnaSelezione(){
  if(!selezione) return;
  const presi = tocchiSelezione();
  ctx.save();
  ctx.lineWidth = 3 / vista.s;
  ctx.strokeStyle = 'rgba(192,69,59,.85)';
  for(const t of presi){
    if(t.p.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(t.p[0][0], t.p[0][1]);
    for(let i=1;i<t.p.length;i++) ctx.lineTo(t.p[i][0], t.p[i][1]);
    ctx.stroke();
  }
  const x = Math.min(selezione.x0, selezione.x1), y = Math.min(selezione.y0, selezione.y1);
  const w = Math.abs(selezione.x1-selezione.x0), h = Math.abs(selezione.y1-selezione.y0);
  ctx.fillStyle = 'rgba(192,69,59,.10)';
  ctx.fillRect(x, y, w, h);
  ctx.setLineDash([8/vista.s, 6/vista.s]);
  ctx.lineWidth = 1.5 / vista.s;
  ctx.strokeStyle = 'rgba(192,69,59,.9)';
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

function disegnaTratto(t){
  if(!t.p.length) return;
  ctx.strokeStyle = t.c;
  ctx.lineWidth   = t.w;
  if(t.p.length === 1){
    ctx.beginPath();
    ctx.arc(t.p[0][0], t.p[0][1], t.w/2, 0, Math.PI*2);
    ctx.fillStyle = t.c; ctx.fill(); return;
  }
  ctx.beginPath();
  ctx.moveTo(t.p[0][0], t.p[0][1]);
  for(let i=1;i<t.p.length;i++) ctx.lineTo(t.p[i][0], t.p[i][1]);
  ctx.stroke();
}

/* Durante il tratto si disegna solo l'ultimo segmento: è ciò che
   tiene l'inchiostro attaccato alla punta invece di farlo inseguire. */
function disegnaUltimoSegmento(t){
  const n = t.p.length;
  if(n < 2) return;
  preparaContesto();
  ctx.strokeStyle = t.c;
  ctx.lineWidth   = t.w;
  ctx.beginPath();
  ctx.moveTo(t.p[n-2][0], t.p[n-2][1]);
  ctx.lineTo(t.p[n-1][0], t.p[n-1][1]);
  ctx.stroke();
}

/* ---------- zoom e spostamento ---------- */
/* Si ingrandisce attorno a un punto fisso dello schermo: quel
   punto del disegno resta esattamente sotto il dito. */
function zoomA(fattore, sx, sy){
  const s2 = Math.max(S_MIN, Math.min(S_MAX, vista.s * fattore));
  const f = s2 / vista.s;
  vista.x = sx - (sx - vista.x) * f;
  vista.y = sy - (sy - vista.y) * f;
  vista.s = s2;
  ridisegna();
}
function zoomPasso(f){
  zoomA(f, dim.w/2, dim.h/2);
}

function adatta(){
  if(!tratti.length){ vista = {x:0,y:0,s:1}; ridisegna(); return; }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const t of tratti) for(const p of t.p){
    if(p[0]<x0)x0=p[0]; if(p[1]<y0)y0=p[1];
    if(p[0]>x1)x1=p[0]; if(p[1]>y1)y1=p[1];
  }
  const m = 60;
  const s = Math.min((dim.w-2*m)/Math.max(x1-x0,1), (dim.h-2*m)/Math.max(y1-y0,1));
  vista.s = Math.max(S_MIN, Math.min(S_MAX, s));
  vista.x = dim.w/2 - (x0+x1)/2 * vista.s;
  vista.y = dim.h/2 - (y0+y1)/2 * vista.s;
  ridisegna();
}

/* rotellina: sposta; con ctrl o cmd — cioè anche col pizzico del
   trackpad, che il browser traduce così — ingrandisce */
tela.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = tela.getBoundingClientRect();
  if(e.ctrlKey || e.metaKey){
    zoomA(Math.pow(0.995, e.deltaY), e.clientX - r.left, e.clientY - r.top);
  }else{
    vista.x -= e.deltaX; vista.y -= e.deltaY;
    ridisegna();
  }
}, {passive:false});

/* ---------- modalità ---------- */
function modo(m){
  modoAttuale = m;
  document.body.className = (m === 'testo') ? 'modo-testo'
                          : (m === 'mano')  ? 'modo-disegno modo-mano'
                          : 'modo-disegno';
  ['testo','penna','gomma','mano'].forEach(k=>{
    const b = document.getElementById('b-'+k);
    if(b) b.classList.toggle('on', m===k);
  });
  tela.style.cursor = (m==='gomma') ? 'cell' : (m==='penna' ? 'crosshair' : '');
  if(m === 'testo') elTesto.focus();
}

document.querySelectorAll('.colore').forEach(b=>{
  b.addEventListener('click', ()=>{
    colore = b.dataset.c;
    document.querySelectorAll('.colore').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(modoAttuale !== 'penna') modo('penna');
  });
});
document.querySelectorAll('.sp').forEach(b=>{
  b.addEventListener('click', ()=>{
    spessore = parseFloat(b.dataset.w);
    document.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(modoAttuale !== 'penna') modo('penna');
  });
});
function palmo(){
  soloPenna = !soloPenna;
  document.getElementById('b-palmo').classList.toggle('on', soloPenna);
}

/* ── IL PALMO NON DEVE PREMERE I BOTTONI ─────────────────
   «Mi clicca cose» era questo: il rifiuto del palmo valeva solo
   sulla tela, mentre la barra continuava ad accettare qualunque
   tocco. Appoggiando la mano vicino al bordo alto si cambiava
   colore, si passava alla gomma, si usciva a schermo intero.
   Quando «solo penna» è acceso, la barra accetta solo penna e
   mouse: il tocco del palmo si ferma prima di diventare un clic.
   ──────────────────────────────────────────────────────── */
document.querySelector('.bar').addEventListener('pointerdown', e=>{
  notaPenna(e);
  if(soloPenna && e.pointerType === 'touch'){
    e.preventDefault();
    e.stopPropagation();
  }
}, true);
/* il clic vero e proprio arriva dopo: se veniva da un tocco
   rifiutato non deve partire */
document.querySelector('.bar').addEventListener('click', e=>{
  if(soloPenna && e.pointerType === 'touch'){ e.preventDefault(); e.stopPropagation(); }
}, true);

/* ── NIENTE USCITE ACCIDENTALI ───────────────────────────
   A schermo intero, su un tablet, quello che fa uscire non è
   un bottone: è il resto della pagina che si comporta come una
   pagina. Il rimbalzo dello scorrimento, il pizzico che
   ingrandisce tutto il documento, il menu del tasto destro
   quando si tiene premuto, il doppio tocco che ingrandisce.
   Si spengono tutti, uno per uno.
   ──────────────────────────────────────────────────────── */
['gesturestart','gesturechange','gestureend'].forEach(ev=>
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('contextmenu', e=>{
  if(e.target.closest('#testo')) return;   /* nel testo serve */
  e.preventDefault();
});
/* il doppio tocco che ingrandisce la pagina: due tocchi a meno
   di 350 ms l'uno dall'altro non devono contare come uno zoom */
let ultimoTocco = 0;
document.addEventListener('touchend', e=>{
  const ora = Date.now();
  if(ora - ultimoTocco < 350 && !e.target.closest('#testo')) e.preventDefault();
  ultimoTocco = ora;
}, {passive:false});
/* lo scorrimento della pagina non esiste: qualunque trascinamento
   fuori dal testo e' roba della lavagna */
document.addEventListener('touchmove', e=>{
  if(e.target.closest('#testo')) return;
  e.preventDefault();
}, {passive:false});

/* ---------- schermo intero ---------- */
function schermoIntero(){
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const el = document.documentElement;
    const chiedi = el.requestFullscreen || el.webkitRequestFullscreen;
    /* «navigationUI: hide» toglie la barra del browser dove il
       sistema lo consente: e' una barra in meno da sfiorare per
       sbaglio col palmo mentre si scrive in alto. */
    const p = chiedi ? chiedi.call(el, {navigationUI:'hide'}) : Promise.reject(new Error('non supportato'));
    Promise.resolve(p).catch(()=>avvisa('Lo schermo intero è stato bloccato dal browser. Se usi la lavagna dentro il sito, aprila dal suo indirizzo diretto.'));
  }else{
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev, ()=>{
    const b = document.getElementById('b-pieno');
    const pieno = !!(document.fullscreenElement || document.webkitFullscreenElement);
    b.textContent = pieno ? '⛶ Esci' : '⛶ Schermo intero';
    b.classList.toggle('on', pieno);
    /* Uscire senza volerlo capita: almeno lo si sa, e si sa come
       rientrare, invece di trovarsi la barra del browser addosso
       nel mezzo di una spiegazione. */
    if(!pieno && eraPieno) avvisa('Sei uscito dallo schermo intero. Il bottone ⛶ ti rimette dentro.');
    eraPieno = pieno;
  }));
let eraPieno = false;

/* ---------- puntatori ---------- */
const attivi = new Map();      // pointerId -> {x,y} in coordinate schermo
const ditaFerme = new Map();   // dita messe da parte dal rifiuto del palmo
let pizzico = null;            // stato del pizzico a due dita
let trascino = null;           // stato dello spostamento con la mano

function schermo(e){
  const r = tela.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
/* ── LA PENNA SI RICONOSCE DA SOLA ───────────────────────
   «Solo penna» è un bottone che nessuno trova prima di essersi
   già rovinato una lavagna. Alla prima volta che tocca lo
   schermo una penna vera, la lavagna lo capisce e accende il
   rifiuto del palmo da sé, dicendolo. Resta un bottone, così
   chi vuole disegnare col dito lo rispegne.
   ──────────────────────────────────────────────────────── */
let pennaVista = false;
function notaPenna(e){
  if(pennaVista || e.pointerType !== 'pen') return;
  pennaVista = true;
  if(!soloPenna){
    soloPenna = true;
    document.getElementById('b-palmo').classList.add('on');
    avvisa('Penna riconosciuta: il tocco delle dita è ignorato. Il bottone «Solo penna» lo rimette.');
  }
}
function accettabile(e){
  if(soloPenna && e.pointerType === 'touch') return false;
  return true;
}

/* ── UN AVVISO CHE NON RUBA IL TOCCO ─────────────────────
   Niente alert: una finestra di sistema, a schermo intero,
   fa uscire dallo schermo intero. Questo è un nastro che
   compare e se ne va da solo, e non riceve puntatori. */
function avvisa(testo){
  let n=document.getElementById('nastro');
  if(!n){
    n=document.createElement('div'); n.id='nastro';
    document.body.appendChild(n);
  }
  n.textContent=testo;
  n.classList.add('on');
  clearTimeout(n._t);
  n._t=setTimeout(()=>n.classList.remove('on'), 3800);
}

tela.addEventListener('pointerdown', e=>{
  notaPenna(e);
  if(modoAttuale === 'testo') return;

  /* ── IL DIFETTO PIÙ GRAVE CHE C'ERA QUI ──────────────────
     Il palmo veniva messo in «attivi» PRIMA di controllare se
     era accettabile. Con la penna in mano e il palmo appoggiato
     i puntatori diventavano due: partiva il pizzico, e il
     pizzico butta via il tratto appena cominciato. Cioè:
     scrivevi, e la riga spariva mentre la lavagna ingrandiva.
     Adesso il controllo viene prima, e un puntatore rifiutato
     non entra da nessuna parte.
     ───────────────────────────────────────────────────────── */
  /* ── DITA E PENNA INSIEME ────────────────────────────────
     Il rifiuto del palmo non puo' essere «ignora tutto quello che
     non e' penna»: e' cosi' che funzionano Procreate e i quaderni
     digitali, e chiunque abbia usato una penna se lo aspetta —
     la penna scrive, le dita spostano e ingrandiscono.
     Quindi un dito solo viene messo da parte, senza disegnare
     niente; quando i diti diventano due, tornano dentro come
     pizzico. Il palmo appoggiato resta un dito solo e non fa mai
     nulla, che e' esattamente quello che serve.
     ───────────────────────────────────────────────────────── */
  if(!accettabile(e)){
    e.preventDefault();
    ditaFerme.set(e.pointerId, schermo(e));
    try{ tela.setPointerCapture(e.pointerId); }catch(_){}
    if(ditaFerme.size === 2){
      /* due dita: diventano un pizzico, e il tratto in corso resta
         dov'e' — la penna non c'entra con quello che fanno le dita */
      ditaFerme.forEach((v,id)=>attivi.set(id, v));
      ditaFerme.clear();
      const v=[...attivi.values()].slice(-2);
      pizzico={d: Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y),
               c: {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}};
    }
    return;
  }

  e.preventDefault();
  attivi.set(e.pointerId, schermo(e));
  try{ tela.setPointerCapture(e.pointerId); }catch(_){}

  /* Due dita: si smette di disegnare e comincia il pizzico. Il
     tratto appena iniziato col primo dito viene tolto, altrimenti
     resterebbe un segno a ogni ingrandimento. */
  if(attivi.size === 2){
    if(inCorso){ tratti.pop(); inCorso = null; ridisegna(); }
    const v = [...attivi.values()];
    pizzico = {d: Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y),
               c: {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}};
    return;
  }
  if(attivi.size > 2) return;

  if(modoAttuale === 'mano'){
    document.body.classList.add('trascina');
    const p = schermo(e);
    trascino = {x:p.x, y:p.y, vx: vista.x, vy: vista.y};
    return;
  }
  if(modoAttuale === 'gomma'){
    avviaAttesaGomma(aMondo(e.clientX, e.clientY), schermo(e));
    cancellaVicino(aMondo(e.clientX, e.clientY));
    return;
  }

  inCorso = { c: colore, w: spessore / vista.s, p: [aMondo(e.clientX, e.clientY)] };
  tratti.push(inCorso);
  ridisegna();
});

tela.addEventListener('pointermove', e=>{
  if(ditaFerme.has(e.pointerId)){ ditaFerme.set(e.pointerId, schermo(e)); return; }
  if(!attivi.has(e.pointerId)) return;
  attivi.set(e.pointerId, schermo(e));
  e.preventDefault();

  if(pizzico && attivi.size >= 2){
    const v = [...attivi.values()];
    const d = Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
    const c = {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2};
    if(pizzico.d > 0){
      const s2 = Math.max(S_MIN, Math.min(S_MAX, vista.s * (d / pizzico.d)));
      const k = s2 / vista.s;
      // ingrandisce attorno al centro fra le due dita, e insieme
      // segue il loro spostamento
      vista.x = c.x - (pizzico.c.x - vista.x) * k;
      vista.y = c.y - (pizzico.c.y - vista.y) * k;
      vista.s = s2;
      ridisegna();
    }
    pizzico = {d, c};
    return;
  }

  if(trascino){
    const p = schermo(e);
    vista.x = trascino.vx + (p.x - trascino.x);
    vista.y = trascino.vy + (p.y - trascino.y);
    ridisegna();
    return;
  }

  if(modoAttuale === 'gomma'){
    const p = aMondo(e.clientX, e.clientY);
    if(selezione){ selezione.x1 = p[0]; selezione.y1 = p[1]; ridisegna(); return; }
    if(attesaGomma){
      const q = schermo(e);
      if(Math.hypot(q.x-attesaGomma.da.x, q.y-attesaGomma.da.y) > FERMO) annullaAttesaGomma();
    }
    cancellaVicino(p);
    return;
  }
  if(!inCorso) return;
  inCorso.p.push(aMondo(e.clientX, e.clientY));
  disegnaUltimoSegmento(inCorso);
});

/* Il tratto si chiude solo qui: mettere anche pointerleave lo
   faceva morire appena nato, perché setPointerCapture lo fa
   scattare subito dopo il pointerdown. */
function finePuntatore(e){
  if(e && e.pointerId !== undefined){
    attivi.delete(e.pointerId);
    ditaFerme.delete(e.pointerId);
    try{ tela.releasePointerCapture(e.pointerId); }catch(_){}
  }else{ attivi.clear(); ditaFerme.clear(); }

  if(attivi.size < 2) pizzico = null;
  if(attivi.size === 0){
    annullaAttesaGomma();
    chiudiSelezione();
    if(trascino){ trascino = null; document.body.classList.remove('trascina'); }
    if(inCorso){
      if(raddrizza) raddrizzaTratto(inCorso);
      inCorso = null; segnaModifica(); ridisegna();
    }
  }
}
tela.addEventListener('pointerup', finePuntatore);
tela.addEventListener('pointercancel', finePuntatore);
window.addEventListener('blur', ()=>finePuntatore());

/* ── LA GOMMA HA DUE MODI ──────────────────────────────────
   Sfregando, cancella il tratto che sta sotto il dito: è il modo
   naturale e resta quello di prima. Ma cancellare mezza lavagna
   un tratto per volta è una perdita di tempo, e allora: se si
   tiene premuto fermi per mezzo secondo si apre un rettangolo di
   selezione — si trascina per racchiudere quello che si vuole
   togliere, e al rilascio se ne va tutto insieme.

   La distinzione fra «tenere premuto» e «cominciare a sfregare»
   la fa il movimento: se il dito si sposta più di qualche pixel
   prima che scatti il mezzo secondo, era uno sfregamento.
   ────────────────────────────────────────────────────────── */
let attesaGomma = null;      // il timer del mezzo secondo
let selezione   = null;      // {x0,y0,x1,y1} in coordinate del mondo
const FERMO = 6;             // pixel di tolleranza per dire «fermo»

function avviaAttesaGomma(punto, schermoIniziale){
  annullaAttesaGomma();
  attesaGomma = {
    da: schermoIniziale,
    timer: setTimeout(()=>{
      attesaGomma = null;
      selezione = {x0:punto[0], y0:punto[1], x1:punto[0], y1:punto[1]};
      document.body.classList.add('seleziona');
      ridisegna();
    }, 500)
  };
}
function annullaAttesaGomma(){
  if(attesaGomma){ clearTimeout(attesaGomma.timer); attesaGomma = null; }
}

/* Un tratto è preso se almeno un suo punto cade nel rettangolo.
   Basta toccarlo: chiedere che ci stia tutto dentro obbligherebbe
   a inseguire le code lunghe dei tratti a mano libera. */
function tocchiSelezione(){
  if(!selezione) return [];
  const a = Math.min(selezione.x0, selezione.x1), b = Math.max(selezione.x0, selezione.x1);
  const c = Math.min(selezione.y0, selezione.y1), d = Math.max(selezione.y0, selezione.y1);
  return tratti.filter(t => t.p.some(p => p[0]>=a && p[0]<=b && p[1]>=c && p[1]<=d));
}

function chiudiSelezione(){
  if(!selezione) return;
  const presi = new Set(tocchiSelezione());
  selezione = null;
  document.body.classList.remove('seleziona');
  if(presi.size){
    tratti = tratti.filter(t => !presi.has(t));
    segnaModifica();
  }
  ridisegna();
}

/* La gomma elimina il tratto intero sotto il dito. La soglia è
   divisa per l'ingrandimento, così resta della stessa grandezza
   apparente a qualunque zoom. */
function cancellaVicino(punto){
  const x = punto[0], y = punto[1];
  const soglia = 14 / vista.s;
  const prima = tratti.length;
  tratti = tratti.filter(t => !t.p.some(p =>
    Math.abs(p[0]-x) < soglia && Math.abs(p[1]-y) < soglia));
  if(tratti.length !== prima){ ridisegna(); segnaModifica(); }
}

function annulla(){ tratti.pop(); ridisegna(); segnaModifica(); }

function pulisci(){
  if(!confirm('Cancellare testo e disegno? Non si può annullare.')) return;
  tratti = []; elTesto.innerText = '';
  vista = {x:0,y:0,s:1};
  ridisegna(); segnaModifica();
}

/* ---------- stato ---------- */
let modificata = false;
function segnaModifica(){ modificata = true; aggiornaStato('non archiviata'); }
elTesto.addEventListener('input', segnaModifica);
function aggiornaStato(t){ elStato.textContent = t; }
window.addEventListener('beforeunload', e=>{
  if(modificata){ e.preventDefault(); e.returnValue = ''; }
});


/* ---------- validità del token ----------
   Il token d'accesso di Supabase dura un'ora. Prima si salvava al
   login e non si rinnovava mai: passata l'ora, ogni funzione da
   docente falliva con un rifiuto del database. Qui si legge la
   scadenza scritta dentro il token stesso e lo si rinnova un
   minuto prima che scada, senza che l'utente se ne accorga. */
function scadenzaToken(){
  try{
    const t = sessionStorage.getItem('atk') || '';
    const c = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (c.exp || 0) * 1000;
  }catch(_){ return 0; }
}
async function assicuraToken(){
  const s = scadenzaToken();
  if(!s) return false;                       // non c'è token
  if(Date.now() < s - 60000) return true;    // ancora buono
  let rtk = '';
  try{ rtk = sessionStorage.getItem('rtk') || ''; }catch(_){}
  if(!rtk) return false;
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: rtk})
    });
    if(!r.ok) return false;
    const d = await r.json();
    if(!d.access_token) return false;
    sessionStorage.setItem('atk', d.access_token);
    if(d.refresh_token) sessionStorage.setItem('rtk', d.refresh_token);
    return true;
  }catch(_){ return false; }
}

/* ---------- archiviazione ---------- */
function token(){
  try{ return sessionStorage.getItem('atk') || ''; }catch(_){ return ''; }
}

async function archivia(){
  const testo = elTesto.innerText.trim();
  if(!testo && !tratti.length){ alert('La lavagna è vuota.'); return; }
  await assicuraToken();
  const atk = token();
  if(!atk){
    alert('Per archiviare devi essere entrato come docente.\n\nApri il sito, accedi con la tua password, poi torna sulla lavagna.');
    return;
  }
  const oggi = new Date().toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'});
  const titolo = prompt('Titolo della lezione da archiviare:', 'Lezione del ' + oggi);
  if(titolo === null) return;

  aggiornaStato('archiviazione…');
  try{
    const res = await fetch(SB_URL + '/rest/v1/lavagne', {
      method:'POST',
      headers:{'apikey': SB_KEY, 'Authorization': 'Bearer ' + atk,
               'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
      body: JSON.stringify({
        titolo: titolo.trim() || ('Lezione del ' + oggi),
        testo: testo,
        tratti: tratti
      })
    });
    if(res.ok){ modificata = false; aggiornaStato('archiviata ✓'); }
    else{
      const t = await res.text();
      aggiornaStato('errore');
      alert('Non è stato possibile archiviare.\n\n' + t.slice(0,300) +
            '\n\nSe parla di permessi, la sessione da docente è scaduta: rientra dal sito.');
    }
  }catch(err){
    aggiornaStato('errore di rete');
    alert('Errore di rete: ' + err.message);
  }
}

/* ---------- avvio ---------- */
function avvia(){
  const r = elArea.getBoundingClientRect();
  if(r.width === 0 || r.height === 0){ requestAnimationFrame(avvia); return; }
  ridimensiona();
}
avvia();
modo('testo');
applicaVista();
if(!token()) aggiornaStato('non sei entrato come docente');

/* ══════════════════════════════════════════════════════════
   LA PENNA CHE RADDRIZZA
   Alla lavagna, col dito o col mouse, non esce una linea dritta
   nemmeno volendo. Qui il tratto appena finito viene misurato e,
   se somiglia a una figura, i suoi punti vengono sostituiti con
   quelli puliti.

   Il tratto resta un elenco di punti come tutti gli altri: gomma,
   annulla, zoom e archiviazione non sanno nemmeno che e' successo
   qualcosa. E' il motivo per cui l'aggancio e' di tre righe.

   Le soglie non sono a occhio: sono quelle misurate costruendo lo
   strumento a parte, su duecentoventi tracce tremolanti finte.
   ══════════════════════════════════════════════════════════ */
let raddrizza = false, freccia = false;

function commutaRaddrizza(){
  raddrizza = !raddrizza;
  document.getElementById('b-raddrizza').classList.toggle('on', raddrizza);
}
function commutaFreccia(){
  freccia = !freccia;
  document.getElementById('b-freccia').classList.toggle('on', freccia);
  if(freccia && !raddrizza) commutaRaddrizza();
}

const _dist = (p,a,b)=>{
  const dx=b[0]-a[0], dy=b[1]-a[1], len=dx*dx+dy*dy;
  if(!len) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t=((p[0]-a[0])*dx + (p[1]-a[1])*dy)/len;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
};
/* Ramer-Douglas-Peucker: tiene solo i punti che, tolti, sposterebbero
   la linea piu' della tolleranza */
function _rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  let max=0, idx=0;
  for(let i=1;i<pts.length-1;i++){
    const d=_dist(pts[i],pts[0],pts[pts.length-1]);
    if(d>max){ max=d; idx=i; }
  }
  if(max>eps) return _rdp(pts.slice(0,idx+1),eps).slice(0,-1).concat(_rdp(pts.slice(idx),eps));
  return [pts[0],pts[pts.length-1]];
}
const _riq = pts=>{
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2,diag:Math.hypot(x1-x0,y1-y0)};
};
/* Douglas-Peucker puo' lasciare due vertici a un passo l'uno dall'altro
   sullo stesso angolo: contarli entrambi trasforma un rettangolo in un
   pentagono */
function _unisci(v,soglia){
  if(v.length<3) return v;
  const out=[v[0]];
  for(let i=1;i<v.length;i++){
    const u=out[out.length-1];
    if(Math.hypot(v[i][0]-u[0], v[i][1]-u[1])>soglia) out.push(v[i]);
  }
  while(out.length>3 && Math.hypot(out[0][0]-out[out.length-1][0], out[0][1]-out[out.length-1][1])<=soglia) out.pop();
  return out;
}
const _area = v=>{
  let a=0;
  for(let i=0;i<v.length;i++){ const p=v[i], q=v[(i+1)%v.length]; a+=p[0]*q[1]-q[0]*p[1]; }
  return Math.abs(a)/2;
};
/* undici gradi, non diciotto: con diciotto un lato a settantatre gradi
   passa per verticale e un trapezio diventa un rettangolo */
function _ortogonale(v){
  for(let i=0;i<v.length;i++){
    const a=v[i], b=v[(i+1)%v.length];
    const ang=Math.abs(Math.atan2(b[1]-a[1], b[0]-a[0])*180/Math.PI)%180;
    if(!(ang<11 || ang>169 || Math.abs(ang-90)<11)) return false;
  }
  return true;
}

function raddrizzaTratto(t){
  const pts=t.p;
  if(pts.length<4) return;
  const r=_riq(pts);
  if(r.diag < 12/vista.s) return;          /* un puntino resta un puntino */

  const primo=pts[0], ultimo=pts[pts.length-1];
  const chiuso = Math.hypot(ultimo[0]-primo[0], ultimo[1]-primo[1]) < r.diag*0.28 && pts.length>10;
  const eps=r.diag*0.045;

  if(!chiuso){
    let max=0;
    pts.forEach(p=>{ max=Math.max(max,_dist(p,primo,ultimo)); });
    const s=_rdp(pts,eps);
    if(s.length<=2 || max < r.diag*0.06){
      t.p = freccia ? _conPunta(primo,ultimo,r.diag) : [primo,ultimo];
    } else {
      t.p = freccia ? s.slice(0,-1).concat(_conPunta(s[s.length-2],ultimo,r.diag))
                    : s;
    }
    return;
  }

  let v=_rdp(pts.concat([primo]),eps);
  if(v.length>1 && Math.hypot(v[0][0]-v[v.length-1][0], v[0][1]-v[v.length-1][1])<eps) v=v.slice(0,-1);
  v=_unisci(v, r.diag*0.07);
  const riemp=_area(v)/Math.max(1,r.w*r.h);

  if(v.length>=4 && riemp>0.86 && _ortogonale(v)){ t.p=_rett(r); return; }
  if(v.length===3){ t.p=v.concat([v[0]]); return; }
  if(v.length===4){
    if(_ortogonale(v) && riemp>0.86) t.p=_rett(r); else t.p=v.concat([v[0]]);
    return;
  }
  /* I raggi vanno misurati sul riquadro normalizzato, non in pixel:
     altrimenti passa solo il cerchio e un'ellisse schiacciata viene
     scambiata per un poligono. La soglia 0,045 sta nel vuoto fra
     ovali (sotto 0,03) ed esagoni (0,06). */
  const ax=Math.max(r.w,1)/2, ay=Math.max(r.h,1)/2;
  const rag=pts.map(p=>Math.hypot((p[0]-r.cx)/ax, (p[1]-r.cy)/ay));
  const m=rag.reduce((a,b)=>a+b,0)/rag.length;
  const sc=Math.sqrt(rag.reduce((a,b)=>a+(b-m)**2,0)/rag.length)/m;
  t.p = sc<0.045 ? _ellisse(r) : v.concat([v[0]]);
}

const _rett = r => [[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1],[r.x0,r.y0]];
function _ellisse(r){
  const out=[];
  for(let i=0;i<=60;i++){
    const a=i/60*2*Math.PI;
    out.push([r.cx + r.w/2*Math.cos(a), r.cy + r.h/2*Math.sin(a)]);
  }
  return out;
}
/* La punta si disegna con lo stesso tratto, tornando indietro sul
   vertice: cosi' resta un elenco di punti come tutti gli altri. */
function _conPunta(da,a,diag){
  const ang=Math.atan2(a[1]-da[1], a[0]-da[0]);
  const l=Math.max(10, diag*0.09);
  const b1=[a[0]-l*Math.cos(ang-Math.PI/7), a[1]-l*Math.sin(ang-Math.PI/7)];
  const b2=[a[0]-l*Math.cos(ang+Math.PI/7), a[1]-l*Math.sin(ang+Math.PI/7)];
  return [da,a,b1,a,b2];
}
