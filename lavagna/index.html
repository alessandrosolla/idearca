<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lavagna — Idearca</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#FBF7F0;color:#1F1B16;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- barra degli strumenti ---------- */
  .bar{
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    padding:.5rem .75rem;background:#fff;border-bottom:1px solid #E3DACB;
    flex:0 0 auto;
  }
  /* Ogni pulsante è almeno 44px: sotto quella misura il dito
     sbaglia bersaglio, ed è la lamentela tipica sul tablet. */
  .bar button{
    font:inherit;font-size:.9rem;font-weight:600;
    min-height:44px;min-width:44px;
    padding:.5rem .85rem;border:1px solid #E3DACB;border-radius:9px;
    background:#fff;color:#1F1B16;cursor:pointer;line-height:1.2;
    touch-action:manipulation;
  }
  .bar button:hover{border-color:#8A7355}
  .bar button.on{background:#1F1B16;color:#fff;border-color:#1F1B16}
  .sep{width:1px;height:32px;background:#E3DACB;margin:0 .15rem}
  .colore{
    width:44px;height:44px;min-width:44px;border-radius:50%;
    border:3px solid #fff;box-shadow:0 0 0 1px #C9BCA6;
    cursor:pointer;padding:0;
  }
  .colore.on{box-shadow:0 0 0 4px #1F1B16}
  .sp{width:44px;height:44px;padding:0!important;display:grid;place-items:center}
  .sp i{display:block;background:#1F1B16;border-radius:99px}
  .spazio{flex:1}
  .stato{font-size:.78rem;color:#5A5148;min-width:8rem;text-align:right}

  /* ---------- area di scrittura ---------- */
  .area{position:relative;flex:1 1 auto;overflow:hidden;background:#FBF7F0}
  #testo{
    position:absolute;inset:0;padding:2rem 2.4rem;margin:0;
    font-size:30px;line-height:1.5;overflow:auto;outline:none;
    white-space:pre-wrap;word-wrap:break-word;
  }
  #testo:empty::before{
    content:"Scrivi qui — il testo è grande per essere letto dal fondo dell'aula.";
    color:#B9AE9C;
  }
  /* La tela sta sopra al testo. Il puntatore la attraversa quando
     siamo in modalità testo, e attraversa il testo quando si disegna. */
  #tela{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  body.modo-testo #tela{pointer-events:none}
  body.modo-disegno #testo{pointer-events:none;user-select:none}

  /* Su tablet in verticale la barra andrebbe a capo su tre righe
     mangiando la lavagna: sotto gli 880px restano le sole icone. */
  @media (max-width:880px){
    .bar{gap:.35rem;padding:.4rem .5rem}
    .bar button{padding:.5rem .6rem;font-size:0}
    .bar button::first-letter{font-size:1.35rem}
    .colore,.sp{font-size:0}
  }
  @media print{.bar{display:none}}
</style>
</head>
<body class="modo-testo">

<div class="bar">
  <button id="b-testo" class="on" onclick="modo('testo')">✏️ Testo</button>
  <button id="b-penna" onclick="modo('penna')">🖊 Penna</button>
  <button id="b-gomma" onclick="modo('gomma')">🧽 Gomma</button>

  <span class="sep"></span>
  <button class="colore on" data-c="#1F1B16" style="background:#1F1B16" title="Nero"></button>
  <button class="colore" data-c="#C0453B" style="background:#C0453B" title="Rosso"></button>
  <button class="colore" data-c="#2C6FB5" style="background:#2C6FB5" title="Blu"></button>
  <button class="colore" data-c="#4FA82F" style="background:#4FA82F" title="Verde"></button>

  <span class="sep"></span>
  <button class="sp" data-w="4"  title="Tratto sottile"><i style="width:16px;height:4px"></i></button>
  <button class="sp on" data-w="8"  title="Tratto medio"><i style="width:16px;height:8px"></i></button>
  <button class="sp" data-w="14" title="Tratto spesso"><i style="width:16px;height:13px"></i></button>

  <span class="sep"></span>
  <button onclick="annulla()">↶ Annulla</button>
  <button onclick="pulisci()">Pulisci</button>
  <button id="b-palmo" onclick="palmo()" title="Ignora il tocco del dito e accetta solo la penna">✋ Solo penna</button>
  <button id="b-pieno" onclick="schermoIntero()">⛶ Schermo intero</button>

  <span class="spazio"></span>
  <span class="stato" id="stato"></span>
  <button onclick="archivia()" style="background:#1F1B16;color:#fff;border-color:#1F1B16">Archivia</button>
</div>

<div class="area" id="area">
  <div id="testo" contenteditable="true" spellcheck="false"></div>
  <canvas id="tela"></canvas>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   LAVAGNA — Idearca
   I tratti si salvano come coordinate relative (0-1), non come
   immagine: pochi KB per lezione e resa nitida a qualunque
   risoluzione, LIM compresa.
   ══════════════════════════════════════════════════════════ */

const SB_URL = 'https://mqjceddrbhpwqjomhohm.supabase.co';
const SB_KEY = 'sb_publishable_D7vDsaervKNJNgdJw';

const tela    = document.getElementById('tela');
const ctx     = tela.getContext('2d');
const elTesto = document.getElementById('testo');
const elStato = document.getElementById('stato');

let tratti  = [];       // [{c:colore, w:spessore, p:[[x,y],…]}]
let inCorso = null;     // tratto che si sta disegnando adesso
let idAttivo = null;    // identificativo del puntatore che sta disegnando
let colore  = '#1F1B16';
let spessore = 8;
let modoAttuale = 'testo';
let soloPenna = false;  // rifiuto del palmo

/* ---------- dimensionamento nitido ----------
   Si misura il CONTENITORE, mai la tela: la larghezza in pixel
   della tela determina anche la sua dimensione sullo schermo, e
   misurando sé stessa si innescava un anello di retroazione che
   la moltiplicava per il dpr a ogni ridimensionamento, fino a
   farle chiedere gigabyte di memoria e bloccare la pagina.
   Il dpr è limitato a 2: oltre non si vede differenza e la
   memoria cresce col quadrato. */
const elArea = document.getElementById('area');
let dim = {w:0, h:0};

function ridimensiona(){
  const r = elArea.getBoundingClientRect();
  if(r.width === 0 || r.height === 0) return;   // non ancora visibile
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  dim = {w: r.width, h: r.height};
  tela.style.width  = r.width  + 'px';
  tela.style.height = r.height + 'px';
  tela.width  = Math.round(r.width  * dpr);
  tela.height = Math.round(r.height * dpr);
  ridisegna();
}
window.addEventListener('resize', ridimensiona);
document.addEventListener('fullscreenchange', ()=>setTimeout(ridimensiona,60));
document.addEventListener('webkitfullscreenchange', ()=>setTimeout(ridimensiona,60));

/* Prepara il contesto: tutte le coordinate sono in pixel CSS. */
function preparaContesto(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';
}

function ridisegna(){
  preparaContesto();
  ctx.clearRect(0,0,dim.w,dim.h);
  for(const t of tratti) disegnaTratto(t, dim);
}

function disegnaTratto(t, d){
  if(!t.p.length) return;
  ctx.strokeStyle = t.c;
  ctx.lineWidth   = t.w;
  ctx.beginPath();
  ctx.lineWidth = t.w * d.w;
  if(t.p.length === 1){          // un punto solo: un pallino
    ctx.arc(t.p[0][0]*d.w, t.p[0][1]*d.w, t.w*d.w/2, 0, Math.PI*2);
    ctx.fillStyle = t.c; ctx.fill(); return;
  }
  ctx.moveTo(t.p[0][0]*d.w, t.p[0][1]*d.w);
  for(let i=1;i<t.p.length;i++) ctx.lineTo(t.p[i][0]*d.w, t.p[i][1]*d.w);
  ctx.stroke();
}

/* Durante il tratto disegna SOLO l'ultimo segmento invece di
   ridisegnare tutta la lavagna: è ciò che tiene l'inchiostro
   attaccato alla punta invece di farlo inseguire. */
function disegnaUltimoSegmento(t, d){
  const n = t.p.length;
  if(n < 2) return;
  preparaContesto();
  ctx.strokeStyle = t.c;
  ctx.lineWidth   = t.w * d.w;
  ctx.beginPath();
  ctx.moveTo(t.p[n-2][0]*d.w, t.p[n-2][1]*d.w);
  ctx.lineTo(t.p[n-1][0]*d.w, t.p[n-1][1]*d.w);
  ctx.stroke();
}

/* ---------- modalità ---------- */
function modo(m){
  modoAttuale = m;
  document.body.className = (m === 'testo') ? 'modo-testo' : 'modo-disegno';
  document.getElementById('b-testo').classList.toggle('on', m==='testo');
  document.getElementById('b-penna').classList.toggle('on', m==='penna');
  document.getElementById('b-gomma').classList.toggle('on', m==='gomma');
  tela.style.cursor = (m==='gomma') ? 'cell' : (m==='penna' ? 'crosshair' : 'default');
  if(m === 'testo') elTesto.focus();
}

document.querySelectorAll('.colore').forEach(b=>{
  b.addEventListener('click', ()=>{
    colore = b.dataset.c;
    document.querySelectorAll('.colore').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(modoAttuale !== 'penna') modo('penna');
  });
});

document.querySelectorAll('.sp').forEach(b=>{
  b.addEventListener('click', ()=>{
    spessore = parseFloat(b.dataset.w);
    document.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(modoAttuale !== 'penna') modo('penna');
  });
});

function palmo(){
  soloPenna = !soloPenna;
  document.getElementById('b-palmo').classList.toggle('on', soloPenna);
}

/* ---------- schermo intero ---------- */
function schermoIntero(){
  const b = document.getElementById('b-pieno');
  if(!document.fullscreenElement){
    const el = document.documentElement;
    const chiedi = el.requestFullscreen || el.webkitRequestFullscreen;
    const p = chiedi ? chiedi.call(el) : Promise.reject(new Error('non supportato'));
    Promise.resolve(p).then(()=>{ b.textContent = '⛶ Esci'; b.classList.add('on'); })
      .catch(()=>alert('Lo schermo intero è stato bloccato dal browser.\n\nSe stai usando la lavagna dentro il sito, aprila dal suo indirizzo diretto:\n' + location.href));
  }else{
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    b.textContent = '⛶ Schermo intero'; b.classList.remove('on');
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const b = document.getElementById('b-pieno');
  const pieno = !!document.fullscreenElement;
  b.textContent = pieno ? '⛶ Esci' : '⛶ Schermo intero';
  b.classList.toggle('on', pieno);
});

/* ---------- disegno ---------- */
/* Coordinate normalizzate SOLO sulla larghezza, per x e per y.
   Normalizzando y sull'altezza, ogni cambio di proporzione
   dell'area — la tastiera del tablet che si apre, una rotazione,
   lo schermo intero — schiacciava il disegno: un quadrato
   diventava un rettangolo. Cosi' invece resta proporzionato, e
   al massimo la parte bassa esce dallo schermo. */
function posizione(e){
  const r = tela.getBoundingClientRect();
  return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.width];
}

function accettabile(e){
  // Con "solo penna" attivo si ignora il dito: è il rifiuto del palmo.
  if(soloPenna && e.pointerType === 'touch') return false;
  return true;
}

tela.addEventListener('pointerdown', e=>{
  if(modoAttuale === 'testo') return;
  if(!accettabile(e)) return;
  if(idAttivo !== null) return;          // un solo puntatore alla volta
  idAttivo = e.pointerId;
  e.preventDefault();
  try{ tela.setPointerCapture(e.pointerId); }catch(_){}

  if(modoAttuale === 'gomma'){ cancellaVicino(posizione(e)); return; }
  inCorso = { c: colore, w: spessore / Math.max(dim.w,1), p: [posizione(e)] };
  tratti.push(inCorso);
  ridisegna();
});

tela.addEventListener('pointermove', e=>{
  if(e.pointerId !== idAttivo) return;
  e.preventDefault();
  if(modoAttuale === 'gomma'){ cancellaVicino(posizione(e)); return; }
  if(!inCorso) return;
  inCorso.p.push(posizione(e));
  disegnaUltimoSegmento(inCorso, dim);
});

/* Il tratto si chiude SOLO qui. In precedenza chiudevo anche su
   pointerleave: ma setPointerCapture fa scattare quell'evento
   subito dopo il pointerdown, e il tratto moriva appena nato —
   era il motivo per cui la penna non disegnava. */
function fineTratto(e){
  if(e && e.pointerId !== idAttivo) return;
  if(idAttivo !== null){ try{ tela.releasePointerCapture(idAttivo); }catch(_){} }
  idAttivo = null;
  if(inCorso){ inCorso = null; segnaModifica(); }
}
tela.addEventListener('pointerup', fineTratto);
tela.addEventListener('pointercancel', fineTratto);
window.addEventListener('blur', ()=>fineTratto());

/* La gomma elimina il tratto intero sotto il dito: l'archivio
   resta pulito, senza tratti bianchi sovrapposti. */
function cancellaVicino([x,y]){
  const soglia = 0.015;
  const prima = tratti.length;
  tratti = tratti.filter(t => !t.p.some(([px,py]) =>
    Math.abs(px-x) < soglia && Math.abs(py-y) < soglia));
  if(tratti.length !== prima){ ridisegna(); segnaModifica(); }
}

function annulla(){ tratti.pop(); ridisegna(); segnaModifica(); }

function pulisci(){
  if(!confirm('Cancellare testo e disegno? Non si può annullare.')) return;
  tratti = []; elTesto.innerText = ''; ridisegna(); segnaModifica();
}

/* ---------- stato ---------- */
let modificata = false;
function segnaModifica(){ modificata = true; aggiornaStato('non archiviata'); }
elTesto.addEventListener('input', segnaModifica);
function aggiornaStato(t){ elStato.textContent = t; }

window.addEventListener('beforeunload', e=>{
  if(modificata){ e.preventDefault(); e.returnValue = ''; }
});

/* ---------- archiviazione ---------- */
function token(){
  try{ return sessionStorage.getItem('atk') || ''; }catch(_){ return ''; }
}

async function archivia(){
  const testo = elTesto.innerText.trim();
  if(!testo && !tratti.length){ alert('La lavagna è vuota.'); return; }

  const atk = token();
  if(!atk){
    alert('Per archiviare devi essere entrato come docente.\n\nApri il sito, accedi con la tua password, poi torna sulla lavagna.');
    return;
  }

  const oggi = new Date().toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'});
  const titolo = prompt('Titolo della lezione da archiviare:', 'Lezione del ' + oggi);
  if(titolo === null) return;

  aggiornaStato('archiviazione…');
  try{
    const res = await fetch(SB_URL + '/rest/v1/lavagne', {
      method:'POST',
      headers:{
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + atk,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        titolo: titolo.trim() || ('Lezione del ' + oggi),
        testo: testo,
        tratti: tratti
      })
    });
    if(res.ok){
      modificata = false;
      aggiornaStato('archiviata ✓');
    }else{
      const t = await res.text();
      aggiornaStato('errore');
      alert('Non è stato possibile archiviare.\n\n' + t.slice(0,300) +
            '\n\nSe parla di permessi, la sessione da docente è scaduta: rientra dal sito.');
    }
  }catch(err){
    aggiornaStato('errore di rete');
    alert('Errore di rete: ' + err.message);
  }
}

/* ---------- avvio ---------- */
/* Il primo dimensionamento aspetta che il riquadro abbia una
   dimensione reale: dentro un iframe appena mostrato può valere
   ancora zero, e la tela resterebbe di 300x150 pixel. */
function avvia(){
  const r = elArea.getBoundingClientRect();
  if(r.width === 0 || r.height === 0){ requestAnimationFrame(avvia); return; }
  ridimensiona();
}
avvia();
modo('testo');
if(!token()) aggiornaStato('non sei entrato come docente');
</script>
</body>
</html>
