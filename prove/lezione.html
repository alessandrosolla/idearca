<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappe e provocazioni — Idearca</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#faf8f3;color:#1c2b1a;font-weight:300;-webkit-font-smoothing:antialiased}
.w{max-width:1040px;margin:0 auto;padding:2rem 1.5rem 4rem}
.k{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:#8a9e87;font-weight:600}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.4rem;font-weight:400;margin:.3rem 0 .5rem}
.sub{font-size:.92rem;line-height:1.7;color:#5a6b58;max-width:66ch}
.et{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:#9a7c2e;
  font-weight:700;margin:1.8rem 0 .7rem;display:flex;align-items:center;gap:.6rem}
.et::after{content:'';flex:1;height:1px;background:rgba(45,90,39,.13)}
.b{font:inherit;font-size:.78rem;padding:.52rem 1.1rem;border-radius:100px;cursor:pointer;
  border:1.5px solid rgba(45,90,39,.22);background:#fff;color:#2d5a27;font-weight:500;transition:all .16s}
.b:hover{background:#2d5a27;color:#fff;border-color:#2d5a27}
.b.pieno{background:#2d5a27;color:#fff;border-color:#2d5a27}
.b.pieno:hover{background:#1c3f18}
.b:disabled{opacity:.35;cursor:default}
.riga{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
select{width:100%;font:inherit;font-size:.9rem;padding:.6rem .7rem;
  border:1px solid rgba(45,90,39,.2);border-radius:9px;background:#fff;outline:none}
select:focus{border-color:#2d5a27}

.carte{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-top:1rem}
.carta{border:1px solid rgba(45,90,39,.14);border-radius:14px;background:#fff;padding:1.2rem 1.3rem}
.carta h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.45rem;font-weight:500;margin-bottom:.2rem}
.carta .q{font-size:.78rem;color:#8a9e87;margin-bottom:.9rem}
.carta p{font-size:.86rem;line-height:1.65;color:#5a6b58;margin-bottom:1rem}

/* ---- la preparazione ----
   Quattro cose diverse dentro ogni tempo, e devono distinguersi
   a colpo d'occhio: si guardano in momenti diversi dell'ora. Lo
   schermo mentre proietti, il parlato mentre parli, la lavagna
   mentre scrivi, le repliche quando ti rispondono e non sai che
   dire — ed è quello il momento in cui una scaletta serve. */
.pannello{border:1px solid rgba(45,90,39,.14);border-radius:14px;background:#fff;
  padding:1rem 1.2rem;margin-bottom:.7rem}
.pannello .lungo{font-size:.9rem;line-height:1.7;color:#3d4e3b}
.pannello .occ{font-size:.82rem;color:#5a6b58;margin-top:.6rem}
.pannello .occ b{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
  color:#9a7c2e;font-weight:700;margin-right:.4rem}
.pannello h4{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;
  font-weight:500;margin-bottom:.35rem}
.pannello .corpo{font-size:.88rem;line-height:1.7;white-space:pre-line;color:#3d4e3b}
.pannello .f{font-size:.75rem;color:#8a9e87;font-style:italic;margin-top:.5rem}
.pannello.citazione .corpo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;
  line-height:1.55;border-left:3px solid rgba(154,124,46,.4);padding-left:.9rem}
.pannello .chiedi{font-size:.86rem;line-height:1.6;color:#2d5a27;margin-top:.6rem;
  background:#f3f6f1;border-radius:8px;padding:.5rem .7rem}
.pannello .chiedi b{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
  display:block;margin-bottom:.15rem;color:#9a7c2e}
.pannello .nota{font-size:.82rem;line-height:1.6;color:#5a6b58;background:#faf8f3;
  border-radius:8px;padding:.5rem .7rem;margin-top:.55rem}
.pannello .nota b{color:#9a7c2e;font-weight:700;font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;display:block;margin-bottom:.15rem}
ul.fonti{margin:0 0 1rem 1.1rem;font-size:.82rem;line-height:1.75;color:#5a6b58}

.tempo{border:1px solid rgba(45,90,39,.14);border-radius:14px;background:#fff;
  padding:.9rem 1.1rem 1rem;margin-bottom:.7rem;scroll-margin-top:1rem}
.tempo.incorso{border-color:#2d5a27;box-shadow:0 0 0 3px rgba(45,90,39,.12)}
.tempo .n{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#9a7c2e;
  font-weight:700;display:flex;align-items:center;gap:.55rem;margin-bottom:.6rem}
.tempo .n .min{background:#2d5a27;color:#fff;border-radius:99px;padding:.16rem .55rem;
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tempo .riq{border-left:3px solid rgba(45,90,39,.18);padding:.1rem 0 .1rem .8rem;margin-bottom:.7rem}
.tempo .riq:last-child{margin-bottom:0}
.tempo .riq > b{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;display:block;margin-bottom:.25rem;color:#8a9e87}
.tempo .riq .t{font-size:.88rem;line-height:1.68;white-space:pre-line;color:#3d4e3b}
.tempo .riq .f{font-size:.76rem;color:#8a9e87;font-style:italic;margin-top:.35rem}
.tempo .schermo{border-left-color:#2d5a27}
.tempo .schermo > b{color:#2d5a27}
.tempo .schermo .t{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.12rem;line-height:1.45}
.tempo .fonte{border-left-color:rgba(154,124,46,.55)}
.tempo .fonte > b{color:#9a7c2e;font-style:italic;text-transform:none;letter-spacing:0;font-size:.78rem}
.tempo .repliche{border-left-color:#c0453b}
.tempo .repliche > b{color:#c0453b}
.tempo .rep{margin-bottom:.55rem}
.tempo .rep:last-child{margin-bottom:0}
.tempo .rep .loro{font-size:.86rem;line-height:1.55;color:#8a5a55;font-style:italic}
.tempo .rep .tu{font-size:.86rem;line-height:1.65;color:#3d4e3b;
  border-left:2px solid rgba(45,90,39,.2);padding-left:.6rem;margin-top:.2rem}
.vuoto{border:1px dashed rgba(45,90,39,.28);border-radius:12px;padding:2rem 1.4rem;
  text-align:center;color:#5a6b58;line-height:1.65;font-size:.9rem}

/* ══════════════════ LA REGIA ══════════════════
   Quando la finestra da proiettare è aperta, questa è la pagina
   che guardi tu: i comandi restano sotto il pollice e il testo
   che devi leggere sta sopra, mentre la classe vede soltanto la
   sua schermata sull'altro schermo. */
.regia{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#1c2b1a;color:#fff;
  padding:.6rem 1rem;display:none;align-items:center;gap:.7rem;flex-wrap:wrap;
  box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.regia.on{display:flex}
body.conRegia .w{padding-bottom:9rem}
.regia .dove{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:#a8c0a4;font-weight:700}
.regia .titolo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem}
.regia .spazio{flex:1}
.regia button{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:9px;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;
  padding:.5rem .9rem;min-height:42px}
.regia button:hover{background:rgba(255,255,255,.18)}
.regia button:disabled{opacity:.3}
.regia button.chiave{background:#fff;color:#1c2b1a;border-color:#fff}
.regia .avanzamento{font-size:.75rem;color:#a8c0a4;font-variant-numeric:tabular-nums}

/* ══════════════════ PROIEZIONE ══════════════════
   Si chiama «sipario» e non «pieno» per una ragione che e'
   costata due giorni: «pieno» era gia' la classe dei bottoni
   principali, e la regola che teneva nascosto questo livello
   nasconde qualunque cosa abbia quella classe. Risultato: i
   bottoni «Proietta» e «Apri la mappa» non si sono mai visti,
   pur essendo nel documento — e un controllo che verifica se un
   elemento esiste non se ne accorge mai.
   Fondo chiaro e non scuro, al contrario delle votazioni: qui si
   proietta accanto alla lavagna vera e i due devono stare insieme
   senza che l'aula debba cambiare luce. */
.sipario{position:fixed;inset:0;z-index:80;display:none;background:#FBF7EF;
  flex-direction:column;padding:1.4rem 2rem 1.2rem;overflow:hidden}
.sipario.on{display:flex}
.sipario .barra{display:flex;align-items:center;gap:.7rem;flex:none;margin-bottom:.8rem}
.sipario .barra .tit{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:#8a9e87;font-weight:700}
.sipario .barra .spazio{flex:1}
.sipario .barra button{font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;
  border:1px solid rgba(45,90,39,.2);border-radius:9px;background:#fff;color:#2d5a27;
  padding:.45rem .8rem;min-height:40px}
.sipario .barra button:hover{border-color:#2d5a27}
.sipario .barra button:disabled{opacity:.3}
.sipario .barra{position:relative;z-index:2}
/* La scena ritaglia: senza, trascinando la mappa i riquadri
   finivano sopra la barra e si cliccava su di loro invece che sui
   pulsanti. Il ritaglio risolve tutte e due le cose insieme. */
.sipario .scena{flex:1;min-height:0;position:relative;display:flex;
  align-items:center;justify-content:center;overflow:hidden;z-index:1}
/* nella finestra da proiettare non c'è nessun comando: solo la classe */
body.soloProiezione .w,body.soloProiezione .regia{display:none}
body.soloProiezione .sipario{display:flex;padding:1.6rem 2.4rem}
body.soloProiezione .sipario .barra{display:none}

/* ---- la mappa concettuale ---- */
#tela{position:absolute;inset:0;pointer-events:none}
.scena.mappa{align-items:flex-start;justify-content:flex-start;cursor:grab}
.scena.mappa.trascino{cursor:grabbing}
/* Sull'id, non sulla classe: l'elemento ha solo l'id, e finche'
   la regola e' rimasta scritta come classe non si e' mai applicata.
   Senza transform-origin all'angolo, ingrandire e trascinare
   partono dal centro mentre i conti li fanno dall'angolo: a scala
   vicina a 1 lo scarto non si nota, a scala piccola la mappa
   finisce fuori dallo schermo e il disegno resta vuoto. */
#dentro{position:absolute;left:0;top:0;transform-origin:0 0}
.ramo{display:flex;align-items:center;gap:7.5rem}
.figli{display:flex;flex-direction:column;gap:1.15rem}
/* Lo spazio fra un riquadro e l'altro non e' estetica: e' il posto
   in cui va scritta la relazione. Una mappa concettuale senza le
   frasi sugli archi sono due parole messe vicine, e vicine non
   vuol dire niente — quindi il vuoto orizzontale serve, e serve
   largo. Nel quadro d'insieme si stringe, perche' li' le frasi
   diventano comunque troppo piccole per leggerle e la priorita'
   torna a essere far stare tutto. */
/* Il quadro d'insieme non si stringe piu'. Stringerlo per farlo
   entrare in una schermata era il modo di renderlo inutile: le
   frasi finivano sopra i riquadri e i tratteggi attraversavano
   tutto. Adesso resta grande e ci si muove dentro, come su una
   carta geografica — che e' poi quello che e'. */
/* Un'area con venti concetti in colonna e' alta il doppio dello
   schermo, e per farcela stare la pagina rimpicciolisce fino a
   dieci pixel: dal fondo dell'aula, niente. Sopra i sei figli la
   colonna si spezza in due, e l'altezza si dimezza. */
/* Piu' si scende, piu' le frasi sugli archi sono corte: lo spazio
   fra i riquadri puo' stringersi senza che si sovrappongano. */
.figli .figli .ramo{gap:6rem}
.figli .figli .figli .ramo{gap:5rem}
.figli .figli{gap:.95rem}
.figli .figli .figli{gap:.8rem}
.nodo{position:relative;background:#fff;border:1.5px solid rgba(45,90,39,.2);
  border-radius:11px;padding:.5rem .8rem;max-width:16rem;
  transition:opacity .3s ease}
.nodo .nn{font-size:.98rem;line-height:1.22;font-weight:500;color:#1c2b1a}
.nodo .nd{font-size:.76rem;line-height:1.3;color:#6b7a68;margin-top:.1rem}
.nodo.liv0{background:#2d5a27;border-color:#2d5a27}
.nodo.liv0 .nn{color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;font-weight:500}
.nodo.liv0 .nd{color:rgba(255,255,255,.72)}
.nodo.liv1{border-color:rgba(45,90,39,.45);background:#eef3ec}
.nodo.liv1 .nn{font-weight:600}
.nodo.liv3{border-style:dashed}
/* Il secondo strato si riconosce: bordo piu' leggero e un filo di
   rientro, cosi' si vede a occhio che cosa e' struttura e che cosa
   e' approfondimento. */
.nodo.piu{background:#fdf8ee;border-color:rgba(154,124,46,.5)}
.nodo.piu .nn{font-size:.92rem;font-weight:500;color:#6b5518}
.nodo.piu .nd{color:#9a8557}
.nodo.legato{box-shadow:0 0 0 3px rgba(154,124,46,.45)}
/* mentre si guarda un rimando, il resto della mappa resta li' ma
   si fa da parte: serve a capire dove cade il salto */
.passi{display:flex;gap:.35rem;align-items:center}
.passo{width:26px;height:4px;border-radius:99px;background:rgba(45,90,39,.16)}
.passo.on{background:#2d5a27}
@media (max-width:600px){ .sipario{padding:.9rem 1rem} }
</style>
</head>
<body>

<div class="w">
  <div class="k">Idearca · solo docente</div>
  <h1 id="titolo">Mappe e provocazioni</h1>
  <p class="sub" id="sottotitolo"></p>

  <div class="et">Il capitolo</div>
  <select id="scelta" onchange="scegli()"></select>

  <div id="corpo"></div>
</div>

<!-- la barra di regia: compare quando proietti sull'altro schermo -->
<div class="regia" id="regia">
  <span class="dove" id="r-dove"></span>
  <span class="titolo" id="r-titolo"></span>
  <span class="spazio"></span>
  <span class="avanzamento" id="r-conta"></span>
  <button id="r-prec" onclick="indietro()">‹ Indietro</button>
  <button id="r-succ" class="chiave" onclick="avanti()">Avanti ›</button>
  <button onclick="chiudiProiezione()">Chiudi la proiezione</button>
</div>

<div class="sipario" id="pieno">
  <div class="barra">
    <span class="tit" id="p-tit"></span>
    <span class="tit" id="p-suggerimento" style="font-weight:400;letter-spacing:.04em;text-transform:none;color:#a8b3a6"></span>
    <button id="p-tutta"   onclick="tuttaLaMappa()" style="display:none">⤢ Tutta la mappa</button>
    <button id="p-fondo"   onclick="commutaFondo()"  style="display:none">⌄ Più a fondo</button>
    <button id="p-rimandi" onclick="commutaRimandi()" style="display:none">⤳ Rimandi</button>
    <span class="passi" id="p-passi"></span>
    <span class="spazio"></span>
    <button id="p-prec" onclick="indietro()">‹ Indietro</button>
    <button id="p-succ" onclick="avanti()">Avanti ›</button>
    <button onclick="chiudi()">Esc</button>
  </div>
  <div class="scena" id="scena">
    <canvas id="tela"></canvas>
    <div id="dentro"></div>
  </div>
</div>

<script src="../js/lezioni.js?v=20260824k"></script>
<script>
/* ══════════════════════════════════════════════════════════
   Nessuna libreria, come tutto il resto del sito.

   LA MAPPA. I riquadri si dispongono da soli con dei flex
   annidati; le frecce e le parole che ci stanno sopra si
   disegnano dopo, misurando dove i riquadri sono finiti. Farlo
   in CSS obbliga a incastri che si rompono appena un ramo ha un
   figlio solo, e soprattutto non lascia scrivere niente sopra
   le linee — che in una mappa concettuale è la metà del lavoro:
   senza la frase sull'arco restano due parole vicine, e vicine
   non vuol dire niente.

   LE DUE FINESTRE. La stessa pagina, aperta con ?proietta,
   diventa lo schermo della classe: nessun comando, nessuna
   nota, solo la schermata. Le due finestre si parlano con un
   BroadcastChannel — e se il browser non ce l'ha, con una
   chiave di localStorage, che scatena l'evento «storage»
   nell'altra finestra e fa lo stesso lavoro.
   ══════════════════════════════════════════════════════════ */
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const titoli = Object.keys(LEZIONI);
const proiettore = new URLSearchParams(location.search).has('proietta');
/* La stessa pagina serve due voci diverse della libreria. Le due
   cose non si somigliano — una si consulta e si studia, l'altra
   si conduce — e tenerle nella stessa schermata voleva dire
   scorrere mezza lezione per arrivare alla mappa. Con `solo` si
   apre una per volta; senza, si vedono tutte e due. */
const solo = new URLSearchParams(location.search).get('solo');
const vuoiMappa = solo !== 'provocazione';
const vuoiProv  = solo !== 'mappa';
let corrente = null;
let modo = null;            // 'mappa' | 'provocazione'
let passo = 0;
let nodi = [];
let archi = [];             // {da, a, r, incrocio}
let vista = {x:0, y:0, s:1};
/* I rimandi trasversali sono la parte piu' preziosa della mappa e
   insieme quella che la rende illeggibile se stanno sempre accesi:
   dodici tratteggi che attraversano otto aree sono un groviglio.
   Si accendono quando servono — cioe' quando li si commenta. */
let rimandi = false;
/* Il secondo strato: i concetti segnati `piu` restano nascosti
   finche' non li si chiede. Una mappa deve poter essere letta a
   colpo d'occhio e insieme scavata fino in fondo, e sono due cose
   che non stanno nella stessa schermata. */
let profondo = false;
let finestra = null;        // la finestra da proiettare, se aperta

/* ---------- il canale fra le due finestre ---------- */
const CANALE = 'idearca-lezione';
let canale = null;
try{ canale = new BroadcastChannel(CANALE); }catch(_){}
function manda(m){
  if(canale) canale.postMessage(m);
  try{ localStorage.setItem(CANALE, JSON.stringify({...m, _t:Date.now()})); }catch(_){}
}
function ricevi(m){
  if(!m) return;
  if(m.tipo === 'pronta'){ if(!proiettore) spedisciStato(); return; }
  if(m.tipo === 'stato' && proiettore){
    corrente = m.corrente; modo = m.modo; passo = m.passo;
    if(m.vista) vista = m.vista;
    if(typeof m.rimandi === 'boolean') rimandi = m.rimandi;
    if(typeof m.profondo === 'boolean' && m.profondo !== profondo){
      profondo = m.profondo; stati = []; }
    document.getElementById('pieno').classList.add('on');
    disegna(m.vista ? 'tienilaVista' : '');
  }
  if(m.tipo === 'chiusa' && proiettore) window.close();
}
if(canale) canale.onmessage = e => ricevi(e.data);
window.addEventListener('storage', e=>{
  if(e.key === CANALE && e.newValue){ try{ ricevi(JSON.parse(e.newValue)); }catch(_){} }
});
function spedisciStato(){
  manda({tipo:'stato', corrente, modo, passo, vista:{...vista}, rimandi, profondo});
}

/* ---------- l'elenco ---------- */
const TESTI = {
  mappa:{t:'Mappe concettuali',
    s:'Il capitolo intero: tutti i concetti, le relazioni scritte sopra le frecce, i rimandi '+
      'trasversali fra un\'area e l\'altra. Sta in piedi da sola — si studia, si consulta, si '+
      'proietta un\'area per volta. Si trascina e si ingrandisce con la rotella, come una carta.'},
  provocazione:{t:'Provocazioni',
    s:'Un\'ora di lezione costruita a tempi: la domanda a cui non si può rispondere con quello '+
      'che si sa, lo schieramento, il fatto che rompe la risposta facile, il testo del filosofo, '+
      'il ritorno. Con quello che dici e le risposte che ti daranno, gia\' pronte.'},
  tutte:{t:'Mappe e provocazioni',
    s:'Due cose per ogni capitolo, e non si somigliano: la mappa è il capitolo intero da '+
      'consultare, la provocazione è un\'ora da condurre.'}
};

(function avvio(){
  const q = solo==='mappa' ? TESTI.mappa : solo==='provocazione' ? TESTI.provocazione : TESTI.tutte;
  document.title = q.t + ' — Idearca';
  const h = document.getElementById('titolo'), sub = document.getElementById('sottotitolo');
  if(h){ h.textContent = q.t; sub.textContent = q.s; }
  if(proiettore){
    document.body.classList.add('soloProiezione');
    manda({tipo:'pronta'});
    return;
  }
  const s = document.getElementById('scelta');
  s.innerHTML = '<option value="">— scegli un capitolo —</option>' +
    titoli.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  scegli();
})();

function mappaDi(L){ return L.mappa || L.albero; }

function scegli(){
  corrente = document.getElementById('scelta').value || null;
  const c = document.getElementById('corpo');
  if(!corrente){
    c.innerHTML = `<div class="et">Che cosa c'è</div>
      <div class="vuoto">Scegli un capitolo qui sopra.<br>
      Pronti <strong>${titoli.length}</strong> capitoli su 120: gli altri arrivano a blocchi.</div>`;
    return;
  }
  const L = LEZIONI[corrente];
  const M = mappaDi(L);
  const p = L.provocazione;
  const tempi = tempiDi(p);
  const q = contaMappa(M);
  c.innerHTML = `
    <div class="carte">
      ${!vuoiMappa ? '' : `
      <div class="carta">
        <h3>La mappa concettuale</h3>
        <div class="q">${q.nodi} concetti · ${q.archi} relazioni${q.incroci?' · '+q.incroci+' rimandi trasversali':''}</div>
        <p>Il capitolo intero, con le relazioni scritte sopra le frecce. Si apre un'area per volta,
        e alla fine si vede tutta. Si trascina e si ingrandisce con la rotella.</p>
        <div class="riga">
          <button class="b pieno" onclick="apri('mappa')">Apri la mappa</button>
        </div>
      </div>`}
      ${!vuoiProv ? '' : `
      <div class="carta">
        <h3>${esc(p.titolo)}</h3>
        <div class="q">provocazione · ${esc(p.durata||'un\'ora')} · ${tempi.length} tempi</div>
        <p>${esc(p.domandaMadre || primaRiga(tempi[0]))}</p>
        <div class="riga">
          <button class="b pieno" onclick="apri('provocazione')">Proietta</button>
          <button class="b" onclick="apri('provocazione',true)">Su due schermi</button>
        </div>
      </div>`}
    </div>

    ${!vuoiProv ? '' : `<div class="vuoto" style="text-align:left;margin-top:1rem;font-size:.84rem">
      <strong>Su due schermi</strong> apre una seconda finestra da trascinare sul proiettore:
      lì la classe vede soltanto la sua schermata, senza comandi e senza note. Tu resti qui,
      con il parlato e le repliche sott'occhio, e avanzi dalla barra in basso.
    </div>`}

    ${vuoiProv && p.perche ? `<div class="et">A che cosa serve</div>
      <div class="pannello"><p class="lungo">${esc(p.perche)}</p>
      ${p.occorrente ? '<p class="occ"><b>occorrente</b> '+esc(p.occorrente)+'</p>' : ''}</div>` : ''}

    ${!vuoiProv ? '' : `<div class="et">L'ora, minuto per minuto — questo lo vedi solo tu</div>` +
      (p.tempi ? p.tempi.map((t,i)=>tempoDisteso(t,i)).join('') : vecchiaForma(p))}

    ${vuoiProv && p.testi && p.testi.length ? `<div class="et">I testi</div>` +
      p.testi.map(t=>`<div class="pannello citazione">
        <div class="corpo">${esc(t.corpo)}</div>
        <div class="f">${esc(t.fonte)}</div>
        ${t.glossa ? '<div class="nota"><b>che cosa farne</b>'+esc(t.glossa)+'</div>' : ''}
      </div>`).join('') : ''}

    ${vuoiProv && p.riserve && p.riserve.length ? `<div class="et">Di riserva — se l'ora corre, o se si spegne</div>` +
      p.riserve.map(r=>`<div class="pannello riserva">
        <h4>${esc(r.titolo)}</h4>
        <div class="corpo">${esc(r.corpo)}</div>
        ${r.chiedi ? '<div class="chiedi"><b>chiedi</b>'+esc(r.chiedi)+'</div>' : ''}
      </div>`).join('') : ''}

    ${vuoiProv && p.compito ? `<div class="et">Da fare per la prossima volta</div>
      <div class="pannello"><p class="lungo">${esc(p.compito)}</p></div>` : ''}

    ${vuoiProv && p.fonti && p.fonti.length ? `<div class="et">Da dove viene</div>
      <ul class="fonti">${p.fonti.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>` : ''}`;
}

function tempoDisteso(t, i){
  return `<div class="tempo" id="tempo-${i}">
    <div class="n"><span class="min">${esc(t.minuti||'')}</span> ${i+1}. ${esc(t.et)}</div>
    ${t.schermo ? '<div class="riq schermo"><b>si proietta</b><div class="t">'+esc(t.schermo)+'</div>'+
      (t.opzioni ? '<div class="f">e si schierano: '+t.opzioni.map(esc).join('  ·  ')+'</div>' : '')+'</div>' : ''}
    ${t.testo ? '<div class="riq fonte"><b>'+esc(t.testo.fonte)+'</b>'+
      (t.testo.glossa ? '<div class="t">'+esc(t.testo.glossa)+'</div>' : '')+'</div>' : ''}
    ${t.parlato ? '<div class="riq parlato"><b>che cosa dici</b><div class="t">'+esc(t.parlato)+'</div></div>' : ''}
    ${t.seDicono && t.seDicono.length ? '<div class="riq repliche"><b>se ti rispondono</b>'+
      t.seDicono.map(s=>'<div class="rep"><div class="loro">'+esc(s.loro)+'</div><div class="tu">'+esc(s.tu)+'</div></div>').join('')+
      '</div>' : ''}
  </div>`;
}

function vecchiaForma(p){
  return `<div class="vuoto" style="margin-bottom:1rem;text-align:left">
      Questo capitolo è ancora nella <strong>forma breve</strong>: c'è l'ossatura dei cinque
      tempi ma non il minutaggio, il parlato, la lavagna e le repliche. Da rifare.</div>` +
    p.atti.map((a,i)=>`<div class="tempo" id="tempo-${i}">
      <div class="n">${i+1}. ${esc(a.et)}</div>
      <div class="riq schermo"><b>si proietta</b><div class="t">${esc(a.testo)}</div>
        ${a.opzioni ? '<div class="f">si schierano: '+a.opzioni.map(esc).join('  ·  ')+'</div>' : ''}
        ${a.fonte ? '<div class="f">'+esc(a.fonte)+'</div>' : ''}</div>
      ${a.nota ? '<div class="riq parlato"><b>nota per te</b><div class="t">'+esc(a.nota)+'</div></div>' : ''}
    </div>`).join('');
}

function tempiDi(p){ return p.tempi || p.atti || []; }
function primaRiga(t){ return ((t && (t.schermo || t.testo)) || '').split('\n')[0]; }
function contaMappa(M){
  let n=0, a=0;
  (function gira(x){ n++; for(const y of (x.f||[])){ a++; gira(y); } })(M);
  return {nodi:n, archi:a, incroci:(M.incroci||[]).length};
}

/* ---------- aprire e chiudere ---------- */
function apri(quale, dueSchermi){
  modo = quale; passo = 0;
  if(quale==='mappa'){ stati = listaStati(); stati._per = corrente; }
  if(dueSchermi){
    finestra = window.open(location.pathname + '?proietta=1', 'idearca-proiezione',
      'width=1280,height=800');
    document.getElementById('regia').classList.add('on');
    document.body.classList.add('conRegia');
    if(modo === 'mappa') preparaMappa();
    aggiornaRegia();
    setTimeout(spedisciStato, 400);
    return;
  }
  document.getElementById('pieno').classList.add('on');
  document.getElementById('p-tit').textContent =
    (quale==='mappa' ? 'Mappa · ' : 'Provocazione · ') + corrente.replace(/^.*— /,'');
  disegna();
  const el = document.documentElement;
  const chiedi = el.requestFullscreen || el.webkitRequestFullscreen;
  if(chiedi) chiedi.call(el).catch(()=>{});
}
function chiudi(){
  document.getElementById('pieno').classList.remove('on');
  modo = null;
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function chiudiProiezione(){
  manda({tipo:'chiusa'});
  try{ if(finestra && !finestra.closed) finestra.close(); }catch(_){}
  finestra = null; modo = null;
  document.getElementById('regia').classList.remove('on');
  document.body.classList.remove('conRegia');
  document.querySelectorAll('.tempo.incorso').forEach(e=>e.classList.remove('incorso'));
}

/* ── QUANTI PASSI HA UNA MAPPA ────────────────────────────
   Non uno per area: le aree non sono tutte grandi uguali. Un
   capitolo come questo ha aree da sei riquadri e aree da
   diciassette, e se si proiettano con lo stesso passo quelle
   grandi finiscono a undici pixel su una LIM — cioe' illeggibili
   proprio dove c'e' piu' da leggere. Sopra i dodici concetti
   l'area si apre in due volte, meta' rami per volta.
   ──────────────────────────────────────────────────────── */
const SOGLIA_AREA = 12;
function contaBase(x){
  if(x.piu) return 0;
  return 1 + (x.f||[]).reduce((s,y)=>s+contaBase(y), 0);
}
function listaStati(){
  const M = mappaDi(LEZIONI[corrente]);
  const s = [{tipo:'titolo'}, {tipo:'aree'}];
  (M.f||[]).forEach((a,i)=>{
    const quanti = contaBase(a);
    const rami = (a.f||[]).filter(x=>!x.piu).length;
    if(quanti > SOGLIA_AREA && rami >= 4){
      const meta = Math.ceil(rami/2);
      s.push({tipo:'area', i, da:0, a:meta, parte:'1 di 2'});
      s.push({tipo:'area', i, da:meta, a:rami, parte:'2 di 2'});
    }else{
      s.push({tipo:'area', i, da:0, a:rami});
    }
  });
  s.push({tipo:'tutto'});
  return s;
}
let stati = [];
function statiMappa(){ return stati.length; }
function acceso(id, si, tinta){
  const b = document.getElementById(id);
  if(!b) return;
  b.style.background  = si ? (tinta||'#2d5a27') : '#fff';
  b.style.color       = si ? '#fff' : '#2d5a27';
  b.style.borderColor = si ? (tinta||'#2d5a27') : 'rgba(45,90,39,.2)';
}
/* I rimandi legano concetti che stanno in aree lontane: accesi
   mentre si guarda un angolo della mappa non si vedevano, perche'
   l'altro capo era fuori schermo — sembravano non funzionare.
   Adesso accenderli inquadra tutta la mappa, e i due capi di ogni
   rimando si illuminano, cosi' si trovano. */
/* ── I RIMANDI ────────────────────────────────────────────
   Sono la parte piu' preziosa della mappa: legano concetti che
   stanno in aree diverse, e sono il punto in cui si vede se il
   capitolo e' stato capito o solo imparato. Ma tenerli sempre
   accesi mentre si apre un'area per volta e' un groviglio, perche'
   l'altro capo e' altrove. Quindi: si accendono sulla mappa
   completa, dove c'e' spazio, e ci si vedono tutti insieme —
   tratteggiati d'ocra, con la loro frase, e i due capi cerchiati
   perche' si trovino a colpo d'occhio.
   ──────────────────────────────────────────────────────── */
function commutaRimandi(){
  preparaMappa();
  if(!archi.some(a=>a.incrocio)) return;
  rimandi = !rimandi;
  acceso('p-rimandi', rimandi);
  if(rimandi) passo = statiMappa()-1;   // i rimandi vivono nella mappa intera
  disegna();
  if(finestra){ aggiornaRegia(); spedisciStato(); }
}

function commutaFondo(){
  profondo = !profondo;
  acceso('p-fondo', profondo, '#9a7c2e');
  if(profondo) passo = statiMappa()-1;
  disegna();
  if(finestra){ aggiornaRegia(); spedisciStato(); }
}
function tuttaLaMappa(){
  passo = statiMappa()-1;
  disegna();
  if(finestra){ aggiornaRegia(); spedisciStato(); }
}
function quanti(){
  if(modo!=='mappa') return tempiDi(LEZIONI[corrente].provocazione).length;
  return statiMappa();
}
function avanti(){ if(passo < quanti()-1){ passo++; aggiorna(); } }
function indietro(){ if(passo > 0){ passo--; aggiorna(); } }
function aggiorna(){
  if(finestra){ aggiornaRegia(); spedisciStato(); }
  else disegna();
}

/* La barra di regia mostra dove sei e porta sotto gli occhi il
   pezzo che devi leggere: la scheda del tempo in corso si
   evidenzia e la pagina ci scorre sopra da sola. */
function aggiornaRegia(){
  const tot = quanti();
  document.getElementById('r-prec').disabled = passo <= 0;
  document.getElementById('r-succ').disabled = passo >= tot-1;
  document.getElementById('r-conta').textContent = (passo+1)+' / '+tot;
  if(modo === 'provocazione'){
    const t = tempiDi(LEZIONI[corrente].provocazione)[passo];
    document.getElementById('r-dove').textContent = t.minuti || ('tempo '+(passo+1));
    document.getElementById('r-titolo').textContent = t.et;
    document.querySelectorAll('.tempo').forEach((e,i)=>e.classList.toggle('incorso', i===passo));
    const el = document.getElementById('tempo-'+passo);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }else{
    if(!stati.length || stati._per !== corrente){ stati = listaStati(); stati._per = corrente; }
    const st = stati[passo] || {tipo:'titolo'};
    const rami = mappaDi(LEZIONI[corrente]).f || [];
    document.getElementById('r-dove').textContent = 'mappa';
    document.getElementById('r-titolo').textContent =
      st.tipo==='titolo' ? 'il titolo' :
      st.tipo==='aree'   ? 'le aree' :
      st.tipo==='tutto'  ? 'tutta la mappa' :
      rami[st.i].n + (st.parte ? '  ·  '+st.parte : '');
  }
}

document.addEventListener('keydown', e=>{
  if(!modo || proiettore) return;
  if(e.key==='Escape'){ finestra ? chiudiProiezione() : chiudi(); return; }
  if(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); avanti(); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); indietro(); }
});
window.addEventListener('beforeunload', ()=>{ if(finestra) manda({tipo:'chiusa'}); });

/* ---------- disegnare ---------- */
function disegna(tienilaVista){
  const d = document.getElementById('dentro');
  const tela = document.getElementById('tela');
  const scena = document.getElementById('scena');
  const tot = quanti();
  const pp = document.getElementById('p-prec'), ps = document.getElementById('p-succ');
  if(pp) pp.disabled = passo <= 0;
  if(ps) ps.disabled = passo >= tot-1;
  const pas = document.getElementById('p-passi');
  if(pas) pas.innerHTML = tot<=12
    ? Array.from({length:tot},(_,i)=>`<span class="passo${i<=passo?' on':''}"></span>`).join('')
    : `<span class="passo on"></span><span style="font-size:.72rem;color:#8a9e87;margin-left:.4rem">${passo+1} / ${tot}</span>`;

  if(modo==='provocazione'){
    tela.style.display='none'; scena.classList.remove('mappa');
    for(const id of ['p-rimandi','p-fondo','p-tutta']){
      const b = document.getElementById(id); if(b) b.style.display = 'none';
    }
    d.style.transform=''; d.style.position='';
    disegnaAtto(d); return;
  }
  for(const id of ['p-rimandi','p-fondo','p-tutta']){
    const b = document.getElementById(id); if(b) b.style.display = '';
  }
  const sg = document.getElementById('p-suggerimento');
  if(sg) sg.textContent = 'trascina per muoverti · rotella per ingrandire';
  tela.style.display=''; scena.classList.add('mappa');
  d.style.position='absolute';
  disegnaMappa(d, tienilaVista);
}

function disegnaAtto(d){
  const a = tempiDi(LEZIONI[corrente].provocazione)[passo];
  /* Va sullo schermo soltanto `schermo`. Il parlato, la lavagna e
     le repliche non escono mai di qui: sono la parte che la classe
     non deve leggere, e questa pagina è proiettata. */
  const corpo = a.schermo || a.testo || '';
  const fonte = a.testo && a.testo.fonte ? a.testo.fonte : a.fonte;
  d.innerHTML = `<div class="atto">
      <div class="n">${passo+1} · ${esc(a.et)}</div>
      <div class="t">${esc(corpo)}</div>
      ${a.opzioni ? '<div class="opz">'+a.opzioni.map(o=>'<div>'+esc(o)+'</div>').join('')+'</div>' : ''}
      ${fonte ? '<div class="f">'+esc(fonte)+'</div>' : ''}
    </div>`;
  d.style.transform='none';
}

/* ---------- la mappa ---------- */
function preparaMappa(){
  const d = document.getElementById('dentro');
  costruisci(d);
}
function costruisci(d){
  if(d.dataset.per === corrente) return;
  d.dataset.per = corrente;
  nodi = []; archi = [];
  d.innerHTML = '<div class="dentro-int" id="dentro-int"></div>';
  const dove = d.querySelector('#dentro-int');
  const M = mappaDi(LEZIONI[corrente]);
  const perNome = new Map(), conte = new Map();
  (function gira(nodo, contenitore, liv, padre, area, sotto){
    const ramo = document.createElement('div'); ramo.className='ramo';
    const el = document.createElement('div');
    el.className = 'nodo liv'+Math.min(liv,3);
    el.innerHTML = `<div class="nn">${esc(nodo.n)}</div>` +
                   (nodo.d ? `<div class="nd">${esc(nodo.d)}</div>` : '');
    ramo.appendChild(el);
    const mio = {el, padre, liv, area, sotto, n:nodo.n, d:nodo.d||'',
                 areaNome: liv===0 ? '' : (liv===1 ? nodo.n : (padre.areaNome||padre.n)),
                 piu: !!(nodo.piu || (padre && padre.piu))};
    if(mio.piu) el.classList.add('piu');
    nodi.push(mio);
    conte.set(nodo.n, (conte.get(nodo.n)||0) + 1);
    if(!perNome.has(nodo.n)) perNome.set(nodo.n, mio);
    if(padre) archi.push({da:padre, a:mio, r:nodo.r||'', incrocio:false});
    if(nodo.f && nodo.f.length){
      const figli = document.createElement('div'); figli.className='figli';
      ramo.appendChild(figli);
      nodo.f.forEach((x,i)=> gira(x, figli, liv+1, mio,
        liv===0 ? i : area, liv===1 ? i : sotto));
    }
    contenitore.appendChild(ramo);
  })(M, dove, 0, null, -1, -1);
  /* I rimandi trasversali sono ciò che distingue una mappa
     concettuale da uno schema ad albero: legano concetti di aree
     diverse, e sono il punto in cui si vede se il capitolo è
     stato capito o soltanto imparato. */
  /* Un nome ripetuto e' un guaio silenzioso: l'incrocio si
     aggancia al primo nodo che porta quel nome, e la freccia
     finisce da tutt'altra parte senza che nessuno se ne accorga.
     Meglio che la pagina lo dica. */
  const doppi = [...conte.entries()].filter(([,n])=>n>1).map(([n])=>n);
  if(doppi.length) console.warn('[mappa] nomi ripetuti, gli incroci possono sbagliare bersaglio:', doppi);
  for(const c of (M.incroci||[])){
    const da = perNome.get(c.da), a = perNome.get(c.a);
    if(!da || !a){ console.warn('[mappa] incrocio senza bersaglio:', c.da, '->', c.a); continue; }
    archi.push({da, a, r:c.r||'', incrocio:true});
    da.haRimando = a.haRimando = true;
    da.capoRimando = a.capoRimando = true;
  }
}

function disegnaMappa(d, tienilaVista){
  costruisci(d);
  const M = mappaDi(LEZIONI[corrente]);
  if(!stati.length || stati._per !== corrente){ stati = listaStati(); stati._per = corrente; }
  const st = stati[Math.min(passo, stati.length-1)] || {tipo:'titolo'};
  const apertaOra = st.tipo==='area' ? st.i : null;
  const ultimo = st.tipo==='tutto';

  /* Mentre si apre un'area, le sorelle spariscono invece di
     restare smorzate: otto riquadri di troppo in colonna
     costringevano la pagina a rimpicciolire tutto a dieci pixel,
     e il posto non si perde lo stesso perche' il titolo in cima
     resta sempre li'. */
  /* Con un'area aperta la radice sparisce. Costava quattrocento
     pixel di larghezza — e la larghezza e' l'unica cosa che
     manca: in altezza resta sempre mezzo schermo vuoto. Il
     titolo dell'area basta a dire dove si e'. */
  for(const n of nodi){
    let vedo;
    if(n.piu) vedo = false;          // deciso sotto: solo nella mappa intera
    else if(n.liv===0) vedo = st.tipo!=='area';
    else if(n.liv===1) vedo = st.tipo==='aree' || ultimo || (apertaOra!==null && n.area===apertaOra);
    else vedo = ultimo || (apertaOra!==null && n.area===apertaOra &&
                           n.sotto >= st.da && n.sotto < st.a);
    /* Un capo di rimando che sta nello strato profondo comparirebbe
       solo con «Piu' a fondo» acceso: il rimando resterebbe monco
       senza che si capisca perche'. Quei pochi nodi si mostrano
       anche con i soli rimandi accesi — non tutto lo strato. */
    if(n.piu) vedo = (profondo && ultimo) || (rimandi && ultimo && n.capoRimando);
    n.visibile = vedo;
    /* La radice si nasconde da sola, non con il suo contenitore:
       dentro il .ramo della radice c'e' tutta la mappa, e
       spegnendolo si spegneva tutto. Restava in piedi soltanto
       l'elenco dei nodi — e siccome adatta(), trovando misura
       zero, teneva la scala di prima, il controllo continuava a
       dare numeri buoni su una schermata vuota. */
    if(n.liv === 0) n.el.style.display = vedo ? '' : 'none';
    else n.el.closest('.ramo').style.display = vedo ? '' : 'none';
    n.el.classList.toggle('acceso', apertaOra!==null && n.liv===1 && n.area===apertaOra);
  }
  /* i capi dei rimandi si cerchiano, cosi' su una mappa da cento
     riquadri si trovano senza cercarli */
  for(const n of nodi) n.el.classList.toggle('legato', !!(rimandi && n.haRimando));
  if(!tienilaVista) adatta(ultimo);
  applicaVista();
}

/* Le aree si incorniciano; la mappa intera no. Farla entrare in
   una schermata vuol dire portarla a un sesto, e a un sesto non e'
   piu' una mappa: e' una macchia. Quindi il quadro d'insieme parte
   a una misura in cui si legge e ci si muove dentro, dall'angolo
   in alto a sinistra — come si apre una carta geografica. */
const SCALA_MINIMA_QUADRO = 0.8;
function adatta(intera, incornicia){
  const dint = document.getElementById('dentro-int');
  const d = document.getElementById('dentro');
  if(!dint) return;
  d.style.transform = 'none';
  const s = document.getElementById('scena').getBoundingClientRect();
  const w = dint.offsetWidth, h = dint.offsetHeight;
  /* Misura zero vuol dire che non c'e' niente da vedere: tornare
     indietro lasciando la scala di prima e' il modo migliore per
     non accorgersene mai. Meglio dirlo. */
  if(!w || !h){ console.warn('[mappa] niente da misurare: la scena e vuota'); return; }
  let k = Math.min(1.35, (s.width-40)/w, (s.height-30)/h);
  if(intera && !incornicia) k = Math.max(k, SCALA_MINIMA_QUADRO);
  vista.s = k>0 ? k : 1;
  if(intera && !incornicia && h*vista.s > s.height){
    vista.x = 24; vista.y = 20;
  }else{
    vista.x = (s.width  - w*vista.s)/2;
    vista.y = (s.height - h*vista.s)/2;
  }
}
function applicaVista(){
  const d = document.getElementById('dentro');
  d.style.transform = `translate(${vista.x}px,${vista.y}px) scale(${vista.s})`;
  collega();
}

/* Le frecce, e sopra le frecce le parole. Una mappa concettuale
   senza le frasi sugli archi non è una mappa: sono due parole
   messe vicine, e vicine non vuol dire niente. */
function collega(){
  const tela = document.getElementById('tela');
  const s = document.getElementById('scena').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  tela.width = Math.round(s.width*dpr); tela.height = Math.round(s.height*dpr);
  tela.style.width = s.width+'px'; tela.style.height = s.height+'px';
  const c = tela.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,s.width,s.height);
  const corpo = Math.max(7, 10.5*vista.s);
  c.font = '600 ' + corpo + "px 'Jost',-apple-system,sans-serif";
  c.textAlign='center'; c.textBaseline='middle';

  /* ── DOVE METTERE LE PAROLE ───────────────────────────────
     Mettere la frase a meta' dell'arco e basta e' quello che
     rendeva la mappa illeggibile: due archi che partono dallo
     stesso nodo hanno la meta' quasi nello stesso punto, e le due
     frasi finiscono una sull'altra («da cui» sopra «da cui»);
     e quando lo spazio fra due riquadri e' poco, la frase cade
     addosso al riquadro.
     Quindi: si tiene l'elenco di dove sono i riquadri e di dove
     si e' gia' scritto, e per ogni frase si prova prima al centro,
     poi un po' piu' su, poi un po' piu' giu'. Se nessuna
     posizione e' libera, la frase non si scrive: meglio un arco
     muto di due parole sovrapposte che non si leggono.
     ───────────────────────────────────────────────────────── */
  const riquadri = nodi.filter(n=>n.visibile).map(n=>{
    const r = n.el.getBoundingClientRect();
    return {x:r.left-s.left, y:r.top-s.top, w:r.width, h:r.height};
  });
  const scritte = [];
  const cozza = (a,b)=> a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  const libero = r => !riquadri.some(b=>cozza(r,b)) && !scritte.some(b=>cozza(r,b));

  /* ── COME SI TIRANO LE LINEE ──────────────────────────────
     Prima erano curve che partivano dalla radice e arrivavano a
     ogni figlio: con otto figli diventano otto curve quasi
     parallele, lunghissime, che si accavallano e non si capisce
     piu' quale entra dove. In una mappa la linea non deve essere
     bella: deve dire senza sforzo chi discende da chi.
     Quindi percorsi ad angolo, con gli spigoli arrotondati. I
     figli di uno stesso nodo condividono lo stesso tratto
     verticale — una dorsale — e da li' escono in orizzontale
     ciascuno alla propria altezza. E' la forma degli organigrammi
     e delle mappe fatte a mano, e si segue con l'occhio senza
     doverla studiare.
     La frase sulla relazione va sull'ultimo tratto orizzontale,
     quello che entra nel figlio: li' non puo' esserci dubbio su
     quale arco stia descrivendo, e ogni figlio ha la sua altezza,
     quindi due frasi non si incontrano mai.
     ───────────────────────────────────────────────────────── */
  const R = Math.max(4, 11*vista.s);

  function angolo(x1,y1,x2,y2){
    const dorsale = x1 + (x2-x1)*0.42;
    c.beginPath();
    if(Math.abs(y2-y1) < 1.5){ c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); return dorsale; }
    const verso = y2 > y1 ? 1 : -1;
    const r = Math.min(R, Math.abs(y2-y1)/2, Math.abs(dorsale-x1), Math.abs(x2-dorsale));
    c.moveTo(x1, y1);
    c.lineTo(dorsale - r, y1);
    c.quadraticCurveTo(dorsale, y1, dorsale, y1 + verso*r);
    c.lineTo(dorsale, y2 - verso*r);
    c.quadraticCurveTo(dorsale, y2, dorsale + r, y2);
    c.lineTo(x2, y2);
    c.stroke();
    return dorsale;
  }

  function punta(x,y,colore){
    const p = Math.max(4, 6*vista.s);
    c.save(); c.setLineDash([]);
    c.beginPath();
    c.moveTo(x,y); c.lineTo(x-p, y-p*0.62); c.lineTo(x-p, y+p*0.62); c.closePath();
    c.fillStyle = colore; c.fill(); c.restore();
  }

  function scrivi(testo, cx, cy, colore){
    if(!testo || corpo < 8) return;
    const larg = c.measureText(testo).width;
    const ph = corpo*1.75, pw = larg + corpo*1.2;
    for(const dy of [0, -ph*1.05, ph*1.05, -ph*2.1, ph*2.1]){
      const r = {x:cx-pw/2, y:cy+dy-ph/2, w:pw, h:ph};
      if(!libero(r)) continue;
      scritte.push(r);
      c.save();
      c.fillStyle = '#FBF7EF';
      c.beginPath();
      if(c.roundRect) c.roundRect(r.x, r.y, pw, ph, ph/2); else c.rect(r.x, r.y, pw, ph);
      c.fill();
      c.fillStyle = colore;
      c.fillText(testo, cx, r.y + ph/2);
      c.restore();
      return;
    }
  }

  // prima l'albero, poi i rimandi: i tratteggi stanno sopra
  for(const arco of archi){
    if(arco.incrocio) continue;
    if(!arco.da.visibile || !arco.a.visibile) continue;
    const A = arco.da.el.getBoundingClientRect(), B = arco.a.el.getBoundingClientRect();
    const x1 = A.right-s.left, y1 = A.top+A.height/2-s.top;
    const x2 = B.left -s.left, y2 = B.top+B.height/2-s.top;
    c.save();
    c.lineWidth = Math.max(1, 1.6*vista.s);
    c.strokeStyle = arco.a.piu ? 'rgba(45,90,39,.24)' : 'rgba(45,90,39,.45)';
    const dorsale = angolo(x1,y1,x2,y2);
    c.restore();
    punta(x2, y2, arco.a.piu ? 'rgba(45,90,39,.3)' : 'rgba(45,90,39,.55)');
    scrivi(arco.r, (dorsale + x2)/2, y2 - corpo*1.35, '#5a6b58');
  }

  for(const arco of archi){
    if(!arco.incrocio || !rimandi) continue;
    if(!arco.da.visibile || !arco.a.visibile) continue;
    const A = arco.da.el.getBoundingClientRect(), B = arco.a.el.getBoundingClientRect();
    const x1 = A.right-s.left, y1 = A.top+A.height/2-s.top;
    const x2 = B.left -s.left, y2 = B.top+B.height/2-s.top;
    c.save();
    c.lineWidth = Math.max(1.2, 1.8*vista.s);
    c.strokeStyle = 'rgba(154,124,46,.85)';
    c.setLineDash([Math.max(4,7*vista.s), Math.max(3,5*vista.s)]);
    const m = Math.max(60*vista.s, Math.abs(x2-x1)/2);
    c.beginPath();
    c.moveTo(x1,y1);
    c.bezierCurveTo(x1+m, y1, x2-m, y2, x2, y2);
    c.stroke();
    c.restore();
    punta(x2, y2, '#9a7c2e');
    /* la frase del rimando non si rimpicciolisce con la mappa:
       e' la cosa che si deve leggere, non il contorno */
    const prima = c.font;
    c.font = "700 " + Math.max(13, 15*Math.min(1, vista.s*1.4)) + "px 'Jost',-apple-system,sans-serif";
    scrivi(arco.r, (x1+x2)/2, (y1+y2)/2, '#9a7c2e');
    c.font = prima;
  }


}

/* ---------- trascinare e ingrandire ----------
   Una mappa esaustiva non ci sta mai tutta su uno schermo, e
   costringerla a starci vuol dire renderla illeggibile. Meglio
   poterla girare come una carta geografica. */
(function navigazione(){
  const scena = document.getElementById('scena');
  let tira = null;
  scena.addEventListener('pointerdown', e=>{
    if(modo!=='mappa') return;
    tira = {x:e.clientX, y:e.clientY, vx:vista.x, vy:vista.y};
    scena.classList.add('trascino');
    try{ scena.setPointerCapture(e.pointerId); }catch(_){}
  });
  scena.addEventListener('pointermove', e=>{
    if(!tira) return;
    vista.x = tira.vx + (e.clientX-tira.x);
    vista.y = tira.vy + (e.clientY-tira.y);
    applicaVista();
    if(finestra) spedisciStato();
  });
  const su = ()=>{ tira=null; scena.classList.remove('trascino'); };
  scena.addEventListener('pointerup', su);
  scena.addEventListener('pointercancel', su);
  scena.addEventListener('wheel', e=>{
    if(modo!=='mappa') return;
    e.preventDefault();
    const s = scena.getBoundingClientRect();
    const cx = e.clientX-s.left, cy = e.clientY-s.top;
    const k = Math.exp(-e.deltaY*0.0016);
    const s2 = Math.max(0.18, Math.min(3, vista.s*k));
    const f = s2/vista.s;
    vista.x = cx - (cx-vista.x)*f;
    vista.y = cy - (cy-vista.y)*f;
    vista.s = s2;
    applicaVista();
    if(finestra) spedisciStato();
  }, {passive:false});
})();

new ResizeObserver(()=>{ if(modo==='mappa'){ adatta(); applicaVista(); } })
  .observe(document.getElementById('scena'));
</script>
