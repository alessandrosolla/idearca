<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votazioni — Idearca</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#FBF7F0;color:#1F1B16;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:1.8rem 1.3rem 4rem}
  .kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#5A5148;font-weight:700}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:.4rem 0 1.3rem}
  h2{font-size:1rem;margin:2rem 0 .7rem}

  button{font:inherit;font-weight:600;cursor:pointer;border:1px solid #E3DACB;
    border-radius:9px;background:#fff;color:#1F1B16;padding:.55rem .9rem}
  button:hover{border-color:#8A7355}
  button.primario{background:#1F1B16;color:#fff;border-color:#1F1B16}
  button.rosso{color:#C0453B}
  input,select,textarea{font:inherit;padding:.6rem .8rem;border:1px solid #E3DACB;
    border-radius:9px;background:#fff;width:100%}
  .riga{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}

  .codice{display:flex;align-items:center;gap:1rem;background:#fff;border:1px solid #E3DACB;
    border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.2rem;flex-wrap:wrap}
  .codice b{font-size:2rem;letter-spacing:.22em;font-variant-numeric:tabular-nums}
  .codice .via{font-size:.85rem;color:#5A5148}

  .elenco{border:1px solid #E3DACB;border-radius:12px;overflow:hidden;background:#fff}
  .voce{display:flex;gap:.8rem;align-items:center;padding:.75rem .95rem;border-bottom:1px solid #EFE7DA}
  .voce:last-child{border-bottom:none}
  .voce.attiva{background:#FFFBF0}
  .voce .tipo{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:#fff;background:#8A7355;border-radius:99px;padding:.18rem .5rem;white-space:nowrap}
  .voce .testo{flex:1;font-size:.95rem;line-height:1.35}
  .voce .n{font-size:.8rem;color:#5A5148;white-space:nowrap}

  .vuoto{border:1px dashed #D8CDBA;border-radius:12px;padding:2rem 1.4rem;
    text-align:center;color:#5A5148;line-height:1.6}
  .avviso{background:#fff;border:1px solid #E3DACB;border-left:4px solid #C0453B;
    border-radius:9px;padding:1.1rem 1.3rem;line-height:1.6}

  /* ══════════════ PROIEZIONE ══════════════
     Fondo scuro: in aula la luce si abbassa, e su fondo scuro i
     colori delle opzioni si staccano invece di annegare nel
     bianco. I passi usati sono quelli della tavolozza pensati
     per superfici scure, non gli stessi del sito schiariti.

     Impianto a due colonne sopra il formato panoramico: la
     domanda a sinistra, i risultati a destra. Prima era tutto
     impilato in verticale e usciva dallo schermo — con sei
     opzioni bisognava scorrere, cosa che una proiezione non può
     chiedere.

     Un colore per opzione, sempre nello stesso ordine, identico
     sul telefono degli studenti: si può dire «chi ha votato il
     blu?». La lettera resta, così l'identità non è mai affidata
     al solo colore. */
  .proiezione{
    position:fixed;inset:0;display:none;z-index:60;
    grid-template-rows:auto 1fr;gap:1.2rem;
    padding:1.5rem 2rem 1.6rem;overflow:hidden;
    background:
      radial-gradient(1100px 700px at 82% -12%, #1E2A44 0%, rgba(30,42,68,0) 65%),
      radial-gradient(900px 600px at -6% 112%, #2A1F2E 0%, rgba(42,31,46,0) 62%),
      #12141A;
    color:#fff;
    --carta:rgba(255,255,255,.055);
    --bordo:rgba(255,255,255,.10);
    --tenue:#8A867E; --secondario:#B9B5AC;
    --giusta:#0ca30c;
    --a:#3987e5; --b:#d95926; --c:#199e70; --d:#c98500; --e:#d55181; --f:#9085e9;
  }
  .proiezione.on{display:grid}

  /* ---- riga alta ---- */
  .alto{display:flex;align-items:center;gap:.85rem;min-width:0}
  .scheda-qr{
    display:flex;align-items:center;gap:.9rem;background:#fff;
    border-radius:14px;padding:.55rem .7rem}
  .scheda-qr canvas{border-radius:6px;display:block}
  .scheda-qr .via{font-size:.78rem;color:#5A5148;line-height:1.4;color:#5A5148}
  .pillola-codice{
    display:block;margin-top:.2rem;color:#12141A;
    font-size:1.45rem;font-weight:800;letter-spacing:.14em;
    font-variant-numeric:tabular-nums}
  .alto .spazio{flex:1}
  .alto button{
    min-height:46px;font-size:.92rem;border-radius:12px;font-weight:700;
    background:var(--carta);border:1px solid var(--bordo);color:#fff;padding:.5rem .9rem}
  .alto button:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2)}
  .alto button:disabled{opacity:.3}
  .alto button.chiave{background:#fff;color:#12141A;border-color:#fff}
  .contatore{
    background:var(--carta);border:1px solid var(--bordo);border-radius:12px;
    padding:.4rem .85rem;text-align:center;line-height:1.2}
  .contatore .grande{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
  .contatore .piccolo{font-size:.62rem;color:var(--tenue);letter-spacing:.1em;text-transform:uppercase}
  .contatore.pulsa .grande{animation:pulsa .5s ease}
  @keyframes pulsa{0%{transform:scale(1)}45%{transform:scale(1.22);color:#8ec5ff}100%{transform:scale(1)}}

  /* ---- corpo a due colonne ---- */
  .corpo{display:grid;grid-template-columns:minmax(0,0.86fr) minmax(0,1.14fr);
    gap:2.4rem;align-items:center;min-height:0;overflow:hidden}
  @media (max-aspect-ratio:13/10){ .corpo{grid-template-columns:1fr;gap:1.2rem;align-content:start} }

  .colonna-domanda{min-width:0}
  .tipo-dom{
    display:inline-flex;align-items:center;gap:.45rem;
    background:var(--carta);border:1px solid var(--bordo);border-radius:99px;
    padding:.3rem .8rem;font-size:.72rem;font-weight:700;color:var(--secondario);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
  .proiezione h3{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.5rem,2.5vw,2.9rem);line-height:1.14;margin:0;
    font-weight:700;letter-spacing:-.015em;text-wrap:balance}

  .risultati{min-width:0;min-height:0;height:100%;display:flex;
    align-items:center;justify-content:center}

  /* ---- barre: riempiono l'altezza disponibile, non la superano ---- */
  .barre{width:100%;height:100%;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(.4rem,1.1vh,.9rem)}
  .barra{
    flex:0 1 auto;display:flex;flex-direction:column;justify-content:center;
    gap:.4rem;min-height:0;
    transition:opacity .4s ease, transform .4s ease}
  .barra .et{display:flex;align-items:center;gap:.75rem;min-width:0}
  .lettera{
    flex:0 0 auto;width:clamp(1.9rem,2.4vw,2.5rem);height:clamp(1.9rem,2.4vw,2.5rem);
    border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:clamp(.9rem,1.15vw,1.2rem);color:#12141A;
    transition:background .35s}
  .barra .testo{flex:1;font-size:clamp(.95rem,1.35vw,1.45rem);line-height:1.25;min-width:0}
  .barra .num{font-size:clamp(.95rem,1.35vw,1.45rem);color:var(--secondario);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .barra .num b{color:#fff;font-size:1.15em}
  .barra .traccia{height:clamp(12px,2.2vh,26px);background:rgba(255,255,255,.09);
    border-radius:99px;overflow:hidden}
  .barra .riempi{height:100%;border-radius:99px;width:0;
    transition:width .65s cubic-bezier(.2,.85,.25,1), background .35s ease}

  .barra.giusta .testo::after{content:" ✓";color:#7ee787;font-weight:800}
  .barra.giusta .lettera{background:var(--giusta)!important;color:#fff}
  .barra.giusta .riempi{background:var(--giusta)!important}
  .barra.sbagliata{opacity:.32}

  /* ---- nuvola: piu ripetuta = piu grande e piu chiara ---- */
  .nuvola{display:flex;flex-wrap:wrap;gap:.4rem 1.3rem;align-items:baseline;
    justify-content:center;line-height:1.06;max-width:100%}
  .nuvola span{font-weight:800;letter-spacing:-.02em;animation:entra .5s ease both}
  @keyframes entra{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
  .legenda{position:absolute;bottom:1rem;right:2rem;font-size:.78rem;color:var(--tenue)}

  .attesa-risposte{color:var(--secondario);font-size:1.2rem;text-align:center;line-height:1.7}
  .attesa-risposte .emo{font-size:3rem;display:block;margin-bottom:.5rem}


/* il tabellone delle squadre, in basso sopra la proiezione */
#tabellone{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(12,26,14,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:2px solid rgba(255,255,255,.12)}
.tab-sq{flex:1;padding:.9rem 1.4rem;display:grid;
  grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;
  gap:.2rem .9rem;align-items:center;transition:background .4s}
.tab-sq.avanti{background:rgba(255,255,255,.07)}
.tab-nome{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.tab-rossi .tab-nome{color:#e8837a}
.tab-blu .tab-nome{color:#8fb8d8}
.tab-punti{grid-row:1/3;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:2.6rem;font-weight:600;line-height:1;color:#f4f1e8}
.tab-barra{grid-column:3;grid-row:1;height:8px;border-radius:8px;
  background:rgba(255,255,255,.12);overflow:hidden}
.tab-barra i{display:block;height:100%;border-radius:8px;transition:width .6s}
.tab-rossi .tab-barra i{background:linear-gradient(90deg,#a8322a,#e8837a)}
.tab-blu   .tab-barra i{background:linear-gradient(90deg,#254b78,#8fb8d8)}
.tab-det{grid-column:3;grid-row:2;font-size:.72rem;color:rgba(230,238,226,.6)}

/* il verdetto, a tutto schermo sopra ogni cosa */
#verdetto{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  background:rgba(10,20,11,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  animation:vd-entra .45s ease both;padding:2rem}
@keyframes vd-entra{from{opacity:0}to{opacity:1}}
.vd-dentro{text-align:center;max-width:820px;width:100%}
.vd-et{font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(230,238,226,.55);font-weight:700;margin-bottom:.7rem}
.vd-titolo{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.6rem,8vw,5.5rem);
  font-weight:600;line-height:1.05;color:#f4f1e8;animation:vd-su .55s ease .12s both}
#verdetto.vince-rossi .vd-titolo{color:#f0968c}
#verdetto.vince-blu   .vd-titolo{color:#a3c8e4}
@keyframes vd-su{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.vd-scarto{font-size:1.05rem;color:rgba(230,238,226,.7);margin-top:.5rem}
.vd-squadre{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:2.2rem 0 1.8rem}
.vd-sq{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:1.4rem 1rem;
  background:rgba(255,255,255,.04);transition:all .3s}
.vd-sq.su{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.3);transform:scale(1.04)}
.vd-nome{display:block;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.vd-rossi .vd-nome{color:#e8837a}
.vd-blu   .vd-nome{color:#8fb8d8}
.vd-punti{display:block;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(2.4rem,7vw,4rem);font-weight:600;line-height:1.1;color:#f4f1e8}
.vd-det{display:block;font-size:.85rem;color:rgba(230,238,226,.6)}
.vd-chiudi{font:inherit;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;padding:.75rem 2rem;border-radius:99px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#e6eee2}
.vd-chiudi:hover{background:rgba(255,255,255,.12)}
@media(max-width:560px){ .vd-squadre{grid-template-columns:1fr} }

.sfida{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1.4rem;
  padding:1rem 1.15rem;border-radius:12px;cursor:pointer;
  border:1px solid #E3DACB;background:#fff;transition:all .22s}
.sfida:hover{border-color:#9a7c2e}
.sfida.accesa{border-color:#9a7c2e;
  background:linear-gradient(120deg,rgba(168,50,42,.07),rgba(63,109,140,.07))}
.sfida input{margin-top:.2rem;width:18px;height:18px;flex:none;cursor:pointer}
.sfida b{display:block;font-weight:600;margin-bottom:.15rem}
.sfida span{font-size:.86rem;line-height:1.55;color:#5A5148}
</style>
</head>
<body>

<div class="wrap" id="regia"></div>

<div class="proiezione" id="proiezione">
  <div class="alto">
    <div class="scheda-qr">
      <canvas id="p-qr"></canvas>
      <div class="via">Inquadra, oppure<br><span id="p-url" style="font-weight:600"></span>
        <span class="pillola-codice" id="p-codice"></span></div>
    </div>
    <span class="spazio"></span>
    <div class="contatore" id="p-box-conta"><div class="grande" id="p-conta">0</div>
      <div class="piccolo">risposte</div></div>
    <div class="contatore"><div class="grande" id="p-passo">1/1</div>
      <div class="piccolo">domanda</div></div>
    <button onclick="qrGrande()">⛶ QR</button>
    <button id="p-prec" onclick="precedente()">‹ Indietro</button>
    <button id="p-succ" class="chiave" onclick="successiva()">Avanti ›</button>
    <button onclick="chiudiProiezione()">Esci</button>
  </div>

  <div class="corpo">
    <div class="colonna-domanda">
      <div><span class="tipo-dom" id="p-tipo"></span></div>
      <h3 id="p-domanda"></h3>
    </div>
    <div class="risultati" id="p-risultati"></div>
  </div>

  <div id="qr-velo" onclick="this.style.display='none'"
       style="display:none;position:fixed;inset:0;background:#fff;z-index:70;
              flex-direction:column;align-items:center;justify-content:center;cursor:pointer">
    <canvas id="qr-max"></canvas>
    <div id="qr-max-url" style="margin-top:1.4rem;font-size:1.6rem;font-weight:600;color:#12141A"></div>
    <div style="margin-top:.5rem;color:#5A5148">tocca per chiudere</div>
  </div>
</div>

<script src="qr.js">
</script>
<script src="banca.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   VOTAZIONI — Idearca
   Regia e proiezione. Solo il docente vede questa pagina: le
   policy del database non lasciano leggere domande e risposte a
   nessun altro. Gli studenti passano dagli sportelli, che
   espongono soltanto la domanda in corso.
   ══════════════════════════════════════════════════════════ */

const SB_URL = 'https://mqjceddrbhpwqjomhohm.supabase.co';
const SB_KEY = 'sb_publishable_D7vDsaervKNJNgdJwknDpQ_Vuuf9CeJ';
const COLORI = ['#C0453B','#2C6FB5','#4FA82F','#E8862B','#8A5CB5','#4EB49A'];

let sessione = null;
let domande = [];
let risposte = {};        // domanda_id -> [valori]
let orologio = null;

function token(){ try{ return sessionStorage.getItem('atk')||''; }catch(_){ return ''; } }
function intest(extra){ return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+token()}, extra||{}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* La risposta attesa non viene salvata nel database: si ritrova
   confrontando il testo della domanda con la banca, così resta
   visibile in regia anche dopo il mescolamento delle opzioni. */
function rispostaAttesa(testo){
  if(typeof BANCA === 'undefined') return null;
  for(const b of BANCA) for(const d of b.domande)
    if(d.testo === testo && d.giusta !== undefined) return d.opzioni[d.giusta];
  return null;
}


/* ---------- validità del token ----------
   Il token d'accesso di Supabase dura un'ora. Prima si salvava al
   login e non si rinnovava mai: passata l'ora, ogni funzione da
   docente falliva con un rifiuto del database. Qui si legge la
   scadenza scritta dentro il token stesso e lo si rinnova un
   minuto prima che scada, senza che l'utente se ne accorga. */
function scadenzaToken(){
  try{
    const t = sessionStorage.getItem('atk') || '';
    const c = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (c.exp || 0) * 1000;
  }catch(_){ return 0; }
}
async function assicuraToken(){
  const s = scadenzaToken();
  if(!s) return false;                       // non c'è token
  if(Date.now() < s - 60000) return true;    // ancora buono
  let rtk = '';
  try{ rtk = sessionStorage.getItem('rtk') || ''; }catch(_){}
  if(!rtk) return false;
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: rtk})
    });
    if(!r.ok) return false;
    const d = await r.json();
    if(!d.access_token) return false;
    sessionStorage.setItem('atk', d.access_token);
    if(d.refresh_token) sessionStorage.setItem('rtk', d.refresh_token);
    return true;
  }catch(_){ return false; }
}

/* ---------- caricamento ---------- */
async function avvia(){
  const r = document.getElementById('regia');
  await assicuraToken();
  if(!token()){
    r.innerHTML = '<div class="kicker">Idearca · Didattica</div><h1>Votazioni</h1>' +
      '<div class="avviso"><strong>Non sei entrato come docente.</strong><br>' +
      'Solo tu puoi creare le domande e vedere le risposte. Apri il sito, accedi con la tua password, poi torna qui.</div>';
    return;
  }
  const res = await fetch(SB_URL+'/rest/v1/menti_sessioni?select=*&aperta=eq.true&order=creato_il.desc&limit=1',
                          {headers:intest()});
  if(!res.ok){
    r.innerHTML = '<div class="avviso"><strong>Il database ha rifiutato la lettura.</strong><br>' +
                  'La sessione da docente potrebbe essere scaduta: rientra dal sito.</div>';
    return;
  }
  const righe = await res.json();
  sessione = righe[0] || null;
  if(sessione) await caricaDomande();
  disegnaRegia();
}

async function caricaDomande(){
  const res = await fetch(SB_URL+'/rest/v1/menti_domande?select=*&sessione_id=eq.'+sessione.id+'&order=posizione.asc',
                          {headers:intest()});
  domande = res.ok ? await res.json() : [];
  await caricaRisposte();
}

async function caricaRisposte(){
  if(!domande.length){ risposte = {}; return; }
  const ids = domande.map(d=>d.id).join(',');
  const res = await fetch(SB_URL+'/rest/v1/menti_risposte?select=domanda_id,valore&domanda_id=in.('+ids+')',
                          {headers:intest()});
  risposte = {};
  if(res.ok) for(const r of await res.json()){
    (risposte[r.domanda_id] = risposte[r.domanda_id] || []).push(r.valore);
  }
}

/* ---------- regia ---------- */
function disegnaRegia(){
  const r = document.getElementById('regia');
  if(!sessione){
    r.innerHTML = `
      <div class="kicker">Idearca · Didattica</div><h1>Votazioni</h1>
      <div class="vuoto"><strong>Nessuna votazione aperta.</strong><br>
        Creane una: verrà generato un codice a sei cifre che gli studenti digitano dal telefono.<br><br>
        <button class="primario" onclick="creaSessione()">Crea una votazione</button>
        <label style="display:flex;align-items:center;gap:.5rem;margin-top:.9rem;font-size:.86rem;color:#5a6b58;justify-content:center">
          <input type="checkbox" id="a-squadre" onchange="cambiaModalita()">
          Sfida a squadre: gli studenti vengono divisi a sorte in rossi e blu
        </label></div>`;
    return;
  }
  r.innerHTML = `
    <div class="kicker">Idearca · Didattica</div><h1>Votazioni</h1>
    <div class="codice">
      <div><span class="via">Gli studenti entrano con il codice</span><br><b>${esc(sessione.codice)}</b></div>
      <div class="via">su<br><strong>${location.origin}${location.pathname.replace(/votazioni\/.*$/,'vota/')}</strong></div>
      <canvas id="r-qr"></canvas>
      <span style="flex:1"></span>
      <button onclick="proietta()" class="primario">▶ Proietta</button>
      ${sessione.a_squadre ? '<button onclick="verdettoAdesso()">🏆 Verdetto</button>' : ''}
      <button class="rosso" onclick="chiudiSessione()">Chiudi votazione</button>
    </div>

    <label class="sfida${sessione.a_squadre?' accesa':''}">
      <input type="checkbox" id="a-squadre" ${sessione.a_squadre?'checked':''} onchange="cambiaModalita()">
      <span><b>Sfida a squadre</b>
      ${sessione.a_squadre
        ? 'Attiva: chi entra viene diviso a sorte in rossi e blu, e alla lavagna compare il tabellone.'

function mostraOpzioni(){

/* ---------- azioni ---------- */
/* Se la votazione e' una sfida, gli studenti vengono divisi a sorte
   quando entrano e alla lavagna compare il tabellone. */
let aSquadre = false;
/* Se la votazione esiste già, la casella la modifica sul momento:
   si può trasformare una votazione normale in una sfida a metà ora,
   senza rifare il codice e senza far rientrare nessuno. */
async function cambiaModalita(){
  aSquadre = document.getElementById('a-squadre')?.checked || false;
  if(!sessione) return;
  const res = await fetch(SB_URL+'/rest/v1/menti_sessioni?id=eq.'+sessione.id, {
    method:'PATCH',
    headers:intest({'Content-Type':'application/json','Prefer':'return=representation'}),
    body: JSON.stringify({a_squadre: aSquadre})
  });
  if(res.ok){
    sessione = (await res.json())[0] || sessione;
    if(!aSquadre) document.getElementById('tabellone')?.remove();
    disegnaRegia();
  }else{
    alert('Non è stato possibile cambiare modalità. Hai eseguito la migrazione 07?');
    document.getElementById('a-squadre').checked = !aSquadre;
  }
}
async function creaSessione(){
  for(let tentativo=0; tentativo<6; tentativo++){
    const codice = String(Math.floor(100000 + Math.random()*900000));
    const res = await fetch(SB_URL+'/rest/v1/menti_sessioni', {
      method:'POST',
      headers:intest({'Content-Type':'application/json','Prefer':'return=representation'}),
      body: JSON.stringify({codice, aperta:true, a_squadre: !!aSquadre})
    });
    if(res.ok){ sessione = (await res.json())[0]; domande=[]; risposte={}; disegnaRegia(); return; }
    if(res.status !== 409) break;   // 409 = codice già usato: si riprova
  }
  alert('Non è stato possibile creare la votazione. La sessione da docente potrebbe essere scaduta.');
}

async function aggiungiDomanda(){
  const tipo = document.getElementById('n-tipo').value;
  const testo = document.getElementById('n-testo').value.trim();
  if(!testo){ alert('Scrivi il testo della domanda.'); return; }
  let opzioni = [];
  if(tipo === 'scelta'){
    opzioni = document.getElementById('n-opzioni').value.split(';').map(s=>s.trim()).filter(Boolean);
    if(opzioni.length < 2){ alert('Servono almeno due opzioni, separate da punto e virgola.'); return; }
  }
  const res = await fetch(SB_URL+'/rest/v1/menti_domande', {
    method:'POST', headers:intest({'Content-Type':'application/json','Prefer':'return=minimal'}),
    body: JSON.stringify({sessione_id: sessione.id, tipo, testo, opzioni, posizione: domande.length+1})
  });
  if(!res.ok){ alert('Non è stato possibile aggiungere la domanda.'); return; }
  document.getElementById('n-testo').value = '';
  if(document.getElementById('n-opzioni')) document.getElementById('n-opzioni').value = '';
  await caricaDomande(); disegnaRegia();
}

async function eliminaDomanda(id){
  if(!confirm('Eliminare la domanda e tutte le sue risposte?')) return;
  await fetch(SB_URL+'/rest/v1/menti_domande?id=eq.'+id, {method:'DELETE', headers:intest()});
  await caricaDomande(); disegnaRegia();
}

async function attiva(id){
  const res = await fetch(SB_URL+'/rest/v1/menti_sessioni?id=eq.'+sessione.id, {
    method:'PATCH', headers:intest({'Content-Type':'application/json','Prefer':'return=representation'}),
    body: JSON.stringify({domanda_attiva: id})
  });
  if(res.ok){ sessione = (await res.json())[0]; disegnaRegia(); }
}

async function chiudiSessione(){
  if(!confirm('Chiudere la votazione? Gli studenti non potranno più rispondere.')) return;
  /* Il verdetto va preso PRIMA di azzerare la sessione: senza il
     codice non si può più chiedere il punteggio, ed era questo il
     motivo per cui la sfida finiva senza che si sapesse chi
     avesse vinto. */
  const eraSfida = sessione.a_squadre, codice = sessione.codice;
  await fetch(SB_URL+'/rest/v1/menti_sessioni?id=eq.'+sessione.id, {
    method:'PATCH', headers:intest({'Content-Type':'application/json','Prefer':'return=minimal'}),
    body: JSON.stringify({aperta:false})
  });
  if(eraSfida) await mostraVerdetto(codice);
  sessione = null; domande = []; risposte = {}; disegnaRegia();
}

/* ══════════════════════════════════════════════════════════
   IL VERDETTO
   Una sfida che finisce senza che si dica chi ha vinto non è una
   sfida. Si proietta a tutto schermo: il nome della squadra, i
   punti delle due, e di quanto. In caso di parità lo dice, invece
   di far vincere la prima delle due per caso.
   ══════════════════════════════════════════════════════════ */
async function punteggioDi(codice){
  try{
    const res = await fetch(SB_URL+'/rest/v1/rpc/menti_punteggio', {
      method:'POST', headers:intest({'Content-Type':'application/json'}),
      body: JSON.stringify({p_codice: codice})
    });
    return res.ok ? await res.json() : null;
  }catch(e){ return null; }
}

async function mostraVerdetto(codice){
  const p = await punteggioDi(codice);
  if(!p) return;
  const r = p.rossi || {punti:0,giuste:0,risposte:0};
  const b = p.blu   || {punti:0,giuste:0,risposte:0};
  const pari = r.punti === b.punti;
  const vince = pari ? null : (r.punti > b.punti ? 'rossi' : 'blu');
  const scarto = Math.abs(r.punti - b.punti);
  const velo = document.createElement('div');
  velo.id = 'verdetto';
  velo.className = pari ? 'pari' : ('vince-'+vince);
  velo.innerHTML = `
    <div class="vd-dentro">
      <div class="vd-et">La sfida è finita</div>
      <div class="vd-titolo">${pari ? 'Pareggio' :
        (vince==='rossi' ? 'Vincono i rossi' : 'Vincono i blu')}</div>
      ${pari ? '<div class="vd-scarto">Stesso punteggio: nessuna delle due squadre passa avanti.</div>'
             : `<div class="vd-scarto">di ${scarto} punt${scarto===1?'o':'i'}</div>`}
      <div class="vd-squadre">
        <div class="vd-sq vd-rossi${vince==='rossi'?' su':''}">
          <span class="vd-nome">Rossi</span>
          <span class="vd-punti">${r.punti}</span>
          <span class="vd-det">${r.giuste} giuste su ${r.risposte}</span>
        </div>
        <div class="vd-sq vd-blu${vince==='blu'?' su':''}">
          <span class="vd-nome">Blu</span>
          <span class="vd-punti">${b.punti}</span>
          <span class="vd-det">${b.giuste} giuste su ${b.risposte}</span>
        </div>
      </div>
      <button class="vd-chiudi" onclick="this.closest('#verdetto').remove()">Chiudi</button>
    </div>`;
  document.body.appendChild(velo);
  document.getElementById('tabellone')?.remove();
}

/* Si può anche proiettare prima di chiudere, per fare il punto
   a metà partita. */
function verdettoAdesso(){ if(sessione) mostraVerdetto(sessione.codice); }

/* Le domande si inseriscono tutte insieme in una sola richiesta.
   La risposta attesa NON viene salvata: serve a te qui in regia,
   la correzione la fai a voce dopo aver mostrato i risultati. */
async function importaBanca(){
  const i = document.getElementById('banca-sel').value;
  if(i === ''){ alert('Scegli prima un capitolo.'); return; }
  const b = BANCA[i];
  /* Le opzioni si mescolano: nel file la risposta giusta è sempre
     la prima, e senza mescolarle basterebbe imparare la posizione. */
  const mescola = a => { const c = a.slice();
    for(let j=c.length-1;j>0;j--){ const k2 = Math.floor(Math.random()*(j+1)); [c[j],c[k2]]=[c[k2],c[j]]; }
    return c; };
  /* Dopo il mescolamento si annota DOVE e' finita la risposta
     giusta: senza questo il database non potrebbe assegnare punti,
     perche' la risposta corretta la conosce solo questo file. */
  const corpo = b.domande.map((d,k)=>{
    let opz = [], giusta = null;
    if(d.opzioni && d.opzioni.length){
      const corretta = d.opzioni[typeof d.giusta === 'number' ? d.giusta : 0];
      opz = mescola(d.opzioni);
      giusta = opz.indexOf(corretta);
      if(giusta < 0) giusta = null;
    }
    return {sessione_id: sessione.id, tipo: d.tipo, testo: d.testo,
            opzioni: opz, giusta, posizione: domande.length + k + 1};
  });
  const res = await fetch(SB_URL+'/rest/v1/menti_domande', {
    method:'POST', headers:intest({'Content-Type':'application/json','Prefer':'return=minimal'}),
    body: JSON.stringify(corpo)
  });
  if(!res.ok){ alert('Non e\' stato possibile caricare il capitolo.'); return; }
  await caricaDomande(); disegnaRegia();
}

/* ---------- proiezione ---------- */
async function proietta(){
  if(!domande.length){ alert('Aggiungi almeno una domanda.'); return; }
  /* Si attende l'attivazione: prima non lo si faceva e lo schermo
     restava vuoto fino al primo aggiornamento, dando l'impressione
     che il pulsante non funzionasse. */
  if(!sessione.domanda_attiva) await attiva(domande[0].id);
  document.getElementById('proiezione').classList.add('on');
  document.getElementById('p-codice').textContent = sessione.codice;
  const base = location.origin + location.pathname.replace(/votazioni\/.*$/,'vota/');
  document.getElementById('p-url').textContent = base.replace(/^https?:\/\//,'');
  /* Il QR porta il codice già dentro l'indirizzo: chi inquadra si
     trova dentro senza digitare nulla. */
  /* La misura segue l'altezza dello schermo: su un proiettore da
     aula un quadrato da 300 pixel e' illeggibile dal fondo. */
  const lato = Math.max(220, Math.min(Math.round(window.innerHeight * 0.34), 460));
  try{ QR.disegna(document.getElementById('p-qr'), base + '?c=' + sessione.codice, lato); }
  catch(e){ document.getElementById('p-url').textContent += '  (QR non disponibile)'; }
  aggiornaProiezione();
  if(orologio) clearInterval(orologio);
  orologio = setInterval(async ()=>{ await assicuraToken(); await caricaRisposte(); aggiornaProiezione(); aggiornaTabellone(); }, 2500);
  const el = document.documentElement;
  const chiedi = el.requestFullscreen || el.webkitRequestFullscreen;
  if(chiedi) Promise.resolve(chiedi.call(el)).catch(()=>{});
}

function chiudiProiezione(){
  document.getElementById('proiezione').classList.remove('on');
  if(orologio){ clearInterval(orologio); orologio = null; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  disegnaRegia();
}

function indiceAttivo(){ return domande.findIndex(d => d.id === sessione.domanda_attiva); }

/* Le domande gia' rivelate: alla prima pressione di Avanti si
   mostra qual era la risposta giusta, alla seconda si passa
   oltre. Cosi' la correzione arriva mentre i risultati sono
   ancora sullo schermo, che e' il momento in cui serve. */
const rivelate = new Set();
function rivela(){
  rivelate.add(sessione.domanda_attiva);
  aggiornaProiezione();
}
async function precedente(){ const i = indiceAttivo(); if(i>0){ await attiva(domande[i-1].id); aggiornaProiezione(); } }
async function successiva(){
  const d = domande.find(x => x.id === sessione.domanda_attiva);
  /* prima pressione: si rivela; seconda: si avanza */
  if(d && d.tipo === 'scelta' && rispostaAttesa(d.testo) && !rivelate.has(d.id)){ rivela(); return; }
  const i = indiceAttivo();
  if(i>=0 && i<domande.length-1){ await attiva(domande[i+1].id); aggiornaProiezione(); }
}

function aggiornaProiezione(){
  const d = domande.find(x => x.id === sessione.domanda_attiva);
  if(!d) return;
  document.getElementById('p-domanda').textContent = d.testo;
  const v = risposte[d.id] || [];
  const i = indiceAttivo();
  document.getElementById('p-tipo').textContent =
    d.tipo === 'nuvola' ? '💬 Una parola' : '📊 Scegli una risposta';
  document.getElementById('p-passo').textContent = (i+1) + '/' + domande.length;
  document.getElementById('p-conta').textContent = v.length;
  document.getElementById('p-prec').disabled = (i <= 0);

  const daRivelare = d.tipo === 'scelta' && rispostaAttesa(d.testo) && !rivelate.has(d.id);
  const succ = document.getElementById('p-succ');
  succ.textContent = daRivelare ? '✓ Mostra la risposta' : 'Avanti ›';
  succ.disabled = !daRivelare && (i >= domande.length-1);
  const prima = +document.getElementById('p-conta').dataset.n || 0;
  document.getElementById('p-risultati').innerHTML =
    d.tipo === 'nuvola' ? nuvola(v) : barre(d, v);
  if(d.tipo !== 'nuvola') animaBarre();
  /* il contatore pulsa quando arrivano risposte nuove: da lontano
     è il segnale che la classe sta rispondendo */
  const box = document.getElementById('p-box-conta');
  if(v.length > prima){ box.classList.remove('pulsa'); void box.offsetWidth; box.classList.add('pulsa'); }
  document.getElementById('p-conta').dataset.n = v.length;
}

/* La grandezza di una parola cresce con la radice della sua
   frequenza: con la proporzione diretta la parola più ripetuta
   schiaccerebbe tutte le altre fino a renderle illeggibili. */
/* La grandezza cresce con la radice della frequenza: con la
   proporzione diretta la parola più ripetuta schiaccerebbe le
   altre. Il colore segue la stessa scala, dal passo più chiaro
   che regge il contrasto fino al più scuro. */
/* Su fondo scuro la scala va al contrario: più una parola è
   ripetuta, più diventa chiara e quindi più stacca. */
const RAMPA = ['#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];

function nuvola(valori){
  if(!valori.length) return '<div class="attesa-risposte"><span class="emo">💬</span>' +
    'In attesa delle prime risposte…<br>' +
    '<span style="font-size:1rem">Inquadrate il codice qui sopra.</span></div>';
  const conte = {};
  for(const v of valori){
    const k = v.trim().toLowerCase().replace(/\s+/g,' ');
    if(k) conte[k] = (conte[k]||0) + 1;
  }
  const voci = Object.entries(conte).sort((a,b)=>b[1]-a[1]).slice(0,45);
  const max = voci[0][1];
  const corpo = voci.map(([parola,n])=>{
    const q = n/max;
    const dim = 1.5 + 4.4*Math.sqrt(q);
    const col = RAMPA[Math.min(RAMPA.length-1, Math.round(q*(RAMPA.length-1)))];
    return '<span style="font-size:' + dim.toFixed(2) + 'rem;color:' + col + '">' +
           esc(parola) + '</span>';
  }).join('');
  const legenda = voci.length > 1
    ? '<div class="legenda">più grande e più scura = più ripetuta · ' + voci.length + ' parole diverse</div>'
    : '';
  return '<div class="nuvola">' + corpo + '</div>' + legenda;
}

/* Barre in tinta unica: la lunghezza porta già l'informazione, e
   un colore per opzione sarebbe decorazione che confonde. */
/* Un colore per opzione, sempre nello stesso ordine: la lettera
   e il colore identificano la stessa cosa sul telefono e sullo
   schermo. La lettera resta, così l'identità non dipende mai dal
   solo colore — serve a chi non distingue le tinte. */
const TINTE = ['var(--a)','var(--b)','var(--c)','var(--d)','var(--e)','var(--f)'];
const LETTERE = 'ABCDEF';

function barre(d, valori){
  const opzioni = Array.isArray(d.opzioni) ? d.opzioni : [];
  const conte = {}; for(const o of opzioni) conte[o] = 0;
  for(const v of valori) if(v in conte) conte[v]++;
  const tot = valori.length;
  const max = Math.max(1, ...Object.values(conte));
  const giusta = rivelate.has(d.id) ? rispostaAttesa(d.testo) : null;

  const html = '<div class="barre">' + opzioni.map((o,k)=>{
    const n = conte[o];
    const perc = tot ? Math.round(n/tot*100) : 0;
    const stato = giusta ? (o === giusta ? ' giusta' : ' sbagliata') : '';
    return '<div class="barra' + stato + '">' +
      '<div class="et">' +
        '<span class="lettera" style="background:' + TINTE[k] + '">' + LETTERE[k] + '</span>' +
        '<span class="testo">' + esc(o) + '</span>' +
        '<span class="num"><b>' + n + '</b> · ' + perc + '%</span>' +
      '</div>' +
      '<div class="traccia"><div class="riempi" data-w="' + Math.round(n/max*100) +
      '" style="background:' + TINTE[k] + '"></div></div></div>';
  }).join('') + '</div>';
  return html;
}

/* Le larghezze si applicano dopo l'inserimento nel documento,
   altrimenti il browser non ha uno stato di partenza da cui
   animare e le barre comparirebbero di scatto.

   Si usa un temporizzatore e non requestAnimationFrame: quello
   non scatta quando la scheda non è in primo piano, e le barre
   restavano a larghezza zero — cioè invisibili — proprio nel caso
   di una proiezione su un secondo schermo. */
function animaBarre(){
  setTimeout(()=>{
    document.querySelectorAll('#p-risultati .riempi').forEach(el=>{
      el.style.width = el.dataset.w + '%';
    });
  }, 30);
}

document.addEventListener('keydown', e=>{
  if(!document.getElementById('proiezione').classList.contains('on')) return;
  if(e.key === 'ArrowRight') successiva();
  if(e.key === 'ArrowLeft')  precedente();
  if(e.key === 'Escape')     chiudiProiezione();
});

avvia();

/* ══════════════════════════════════════════════════════════
   IL TABELLONE
   I punti li conta il server: qui si disegnano soltanto. Si
   aggiorna insieme alle risposte, ogni volta che si ricarica.
   ══════════════════════════════════════════════════════════ */
async function aggiornaTabellone(){
  if(!sessione || !sessione.a_squadre) return;
  try{
    const res = await fetch(SB_URL+'/rest/v1/rpc/menti_punteggio', {
      method:'POST', headers:intest({'Content-Type':'application/json'}),
      body: JSON.stringify({p_codice: sessione.codice})
    });
    if(!res.ok) return;
    disegnaTabellone(await res.json());
  }catch(e){}
}

function disegnaTabellone(p){
  if(!p) return;
  let box = document.getElementById('tabellone');
  if(!box){
    box = document.createElement('div');
    box.id = 'tabellone';
    document.body.appendChild(box);
  }
  const r = p.rossi || {punti:0,giuste:0,risposte:0};
  const b = p.blu   || {punti:0,giuste:0,risposte:0};
  const massimo = Math.max(1, r.punti, b.punti);
  const guida = r.punti === b.punti ? 'pari' : (r.punti > b.punti ? 'rossi' : 'blu');
  box.innerHTML =
    '<div class="tab-sq tab-rossi' + (guida==='rossi'?' avanti':'') + '">'
    + '<span class="tab-nome">Rossi</span>'
    + '<span class="tab-punti">' + r.punti + '</span>'
    + '<span class="tab-barra"><i style="width:' + Math.round(r.punti/massimo*100) + '%"></i></span>'
    + '<span class="tab-det">' + r.giuste + ' giuste su ' + r.risposte + '</span></div>'
    + '<div class="tab-sq tab-blu' + (guida==='blu'?' avanti':'') + '">'
    + '<span class="tab-nome">Blu</span>'
    + '<span class="tab-punti">' + b.punti + '</span>'
    + '<span class="tab-barra"><i style="width:' + Math.round(b.punti/massimo*100) + '%"></i></span>'
    + '<span class="tab-det">' + b.giuste + ' giuste su ' + b.risposte + '</span></div>';
}

</script>
