<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vota — Idearca</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(700px 420px at 90% -10%, #E8F0FC 0%, rgba(232,240,252,0) 62%),
      radial-gradient(600px 400px at 0% 106%, #FBEFE4 0%, rgba(251,239,228,0) 60%),
      #FBF7F0;
    color:#1B1815;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;justify-content:center;padding:1.3rem 1rem 3rem;
    -webkit-font-smoothing:antialiased;
    --serie:#2a78d6; --tenue:#6B6257; --carta:#fff;
  }
  .foglio{width:100%;max-width:520px}

  .cima{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem}
  .cima .marchio{font-family:Georgia,serif;font-weight:700;font-size:1.05rem}
  .cima .pill{margin-left:auto;background:#1B1815;color:#fff;border-radius:99px;
    padding:.25rem .75rem;font-size:.86rem;font-weight:700;letter-spacing:.12em;
    font-variant-numeric:tabular-nums}

  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.75rem;margin:.2rem 0 1.2rem;
    line-height:1.2}

  .tipo{display:inline-flex;align-items:center;gap:.4rem;background:var(--carta);
    border-radius:99px;padding:.3rem .8rem;font-size:.76rem;font-weight:700;
    color:var(--tenue);letter-spacing:.08em;text-transform:uppercase;
    box-shadow:0 2px 10px rgba(27,24,21,.06);margin-bottom:.7rem}

  .domanda{
    background:var(--carta);border-radius:20px;padding:1.4rem 1.3rem;
    font-size:1.3rem;line-height:1.35;font-weight:600;margin-bottom:1.2rem;
    box-shadow:0 3px 18px rgba(27,24,21,.07)}

  input[type=text]{
    font:inherit;font-size:1.2rem;width:100%;padding:1rem 1.1rem;
    border:2px solid #E7DFD1;border-radius:16px;background:var(--carta);outline:none}
  input[type=text]:focus{border-color:var(--serie)}

  button{
    font:inherit;font-weight:700;cursor:pointer;width:100%;
    border:none;border-radius:18px;background:var(--carta);color:#1B1815;
    padding:1.05rem 1.1rem;font-size:1.06rem;text-align:left;
    margin-bottom:.7rem;line-height:1.35;
    box-shadow:0 3px 14px rgba(27,24,21,.07);
    display:flex;align-items:center;gap:.9rem;
    transition:transform .12s ease, box-shadow .12s ease}
  button:active{transform:scale(.985);box-shadow:0 1px 6px rgba(27,24,21,.1)}
  /* Gli stessi colori della proiezione, nello stesso ordine: la
     lettera e la tinta identificano l'opzione su entrambi gli
     schermi. La lettera resta, così non dipende dal solo colore. */
  button .lettera{
    flex:0 0 auto;width:2.5rem;height:2.5rem;border-radius:50%;
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem}
  button.primario{background:#1B1815;color:#fff;justify-content:center;text-align:center}

  .aiuto{font-size:.88rem;color:var(--tenue);line-height:1.6;margin-top:.9rem}
  .esito{background:var(--carta);border-radius:20px;padding:1.5rem 1.4rem;
    line-height:1.6;box-shadow:0 3px 18px rgba(27,24,21,.07)}
  .esito .emo{font-size:3rem;display:block;margin-bottom:.5rem}
  .attesa{background:var(--carta);border-radius:20px;padding:2.4rem 1.4rem;
    text-align:center;color:var(--tenue);line-height:1.7;
    box-shadow:0 3px 18px rgba(27,24,21,.07)}
  .attesa .emo{font-size:3rem;display:block;margin-bottom:.6rem}
  .puntino{display:inline-block;width:9px;height:9px;border-radius:50%;
    background:var(--serie);margin:0 3px;animation:p 1.2s infinite}
  .puntino:nth-child(2){animation-delay:.2s}
  .puntino:nth-child(3){animation-delay:.4s}
  @keyframes p{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .err{color:#C0453B;font-size:.92rem;margin-top:.7rem;min-height:1.2rem;font-weight:600}

  /* la risposta scelta, nel colore della squadra */
  button.mia{box-shadow:0 0 0 3px rgba(27,24,21,.25);transform:scale(.985)}
  body[data-squadra="rossi"] button.mia{background:#c0453b;color:#fff;
    box-shadow:0 0 0 3px rgba(168,50,42,.35)}
  body[data-squadra="blu"] button.mia{background:#3f6d8c;color:#fff;
    box-shadow:0 0 0 3px rgba(37,75,120,.35)}
  .mia-risposta{border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:.9rem;
    font-size:1.15rem;font-weight:700;line-height:1.35;
    background:var(--carta);color:#1B1815;box-shadow:0 3px 14px rgba(27,24,21,.08)}
  .mr-et{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;opacity:.7;margin-bottom:.25rem}
  body[data-squadra="rossi"] .mia-risposta{background:#c0453b;color:#fff}
  body[data-squadra="blu"]   .mia-risposta{background:#3f6d8c;color:#fff}

  /* la fascia che dice a quale squadra si appartiene */
  #fascia-squadra{position:fixed;left:0;right:0;top:0;z-index:50;
    padding:.55rem 1rem;text-align:center;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:.72rem;color:#fff}
  body[data-squadra="rossi"] #fascia-squadra{background:linear-gradient(90deg,#a8322a,#c0453b)}
  body[data-squadra="blu"]   #fascia-squadra{background:linear-gradient(90deg,#254b78,#3f6d8c)}
  body[data-squadra] .schermo{padding-top:3.2rem}
</style>
</head>
<body>
<div class="foglio" id="foglio"></div>

<script>
/* ══════════════════════════════════════════════════════════
   VOTA — Idearca
   Pagina per gli studenti. Non legge nessuna tabella: chiede
   allo "sportello" del database qual è la domanda proiettata in
   questo momento, e manda la risposta dallo stesso sportello.
   Nessun nome, nessun accesso: la risposta è anonima.
   ══════════════════════════════════════════════════════════ */

const SB_URL = 'https://mqjceddrbhpwqjomhohm.supabase.co';
const SB_KEY = 'sb_publishable_D7vDsaervKNJNgdJwknDpQ_Vuuf9CeJ';

const TINTE = ['#256abf','#c14e20','#127553','#946100','#c23c6d','#5a4bc4'];
const el = document.getElementById('foglio');
let codice = (new URLSearchParams(location.search).get('c') || '').trim();
let domanda = null;         // domanda attualmente proiettata
/* La squadra viene assegnata dal server, non scelta qui: resta
   valida per tutta la sessione e non si può cambiare ricaricando. */
let squadra = sessionStorage.getItem('menti-squadra-'+codice) || null;
let giaRisposto = false;
let orologio = null;

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function intest(){ return {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}; }

/* ricorda a quali domande si ha già risposto, così ricaricando la
   pagina non si vota due volte la stessa */
function segnaRisposta(id){
  try{
    const v = JSON.parse(localStorage.getItem('voti') || '[]');
    if(!v.includes(id)){ v.push(id); localStorage.setItem('voti', JSON.stringify(v.slice(-80))); }
  }catch(_){}
}
function haGiaRisposto(id){
  try{ return JSON.parse(localStorage.getItem('voti') || '[]').includes(id); }catch(_){ return false; }
}

/* ---------- schermate ---------- */
function schermataCodice(errore){
  el.innerHTML = `
    <div class="cima"><span class="marchio">Idearca</span></div>
    <h1>Entra nella votazione</h1>
    <input type="text" id="c" inputmode="numeric" autocomplete="off"
           placeholder="Codice a 6 cifre" value="${esc(codice)}" maxlength="8">
    <div class="err">${esc(errore||'')}</div>
    <button class="primario" onclick="entra()">Entra</button>
    <p class="aiuto">Il codice è proiettato sulla lavagna. Non serve nessun accesso e la tua
    risposta è anonima: nessuno può sapere che cosa hai scritto tu.</p>`;
  const i = document.getElementById('c');
  i.focus();
  i.addEventListener('keydown', e=>{ if(e.key === 'Enter') entra(); });
}

function schermataAttesa(){
  el.innerHTML = `
    <div class="cima"><span class="marchio">Idearca</span><span class="pill">${esc(codice)}</span></div>
    <h1>Ci sei 🎉</h1>
    <div class="attesa">
      <span class="emo">⏳</span>
      In attesa della prossima domanda<br>
      <span class="puntino"></span><span class="puntino"></span><span class="puntino"></span>
      <div style="margin-top:1rem;font-size:.86rem">Lascia aperta questa pagina.<br>
        Se non arriva nulla, controlla di aver digitato il codice giusto.</div>
    </div>`;
}

function schermataDomanda(d){
  const opzioni = Array.isArray(d.opzioni) ? d.opzioni : [];
  const LETTERE = 'ABCDEF';
  el.innerHTML = `
    <div class="cima"><span class="marchio">Idearca</span><span class="pill">${esc(codice)}</span></div>
    <span class="tipo">${d.tipo === 'nuvola' ? '💬 Una parola' : '📊 Scegli una risposta'}</span>
    <div class="domanda">${esc(d.testo)}</div>
    ${d.tipo === 'scelta'
      ? opzioni.map((o,i)=>`<button data-v="${esc(String(o))}">
            <span class="lettera" style="background:${TINTE[i]}">${LETTERE[i]}</span>
            <span>${esc(String(o))}</span></button>`).join('')
      : `<input type="text" id="risposta" maxlength="40" autocomplete="off"
              placeholder="Scrivi una o due parole">
         <div class="err" id="err"></div>
         <button class="primario" onclick="inviaTesto()">Invia</button>
         <p class="aiuto">Compariranno sullo schermo insieme a quelle dei tuoi compagni:
         più una parola viene ripetuta, più diventa grande.</p>`}`;
  /* Il valore viaggia in un attributo invece che dentro onclick:
     con le virgolette nel testo di un'opzione il codice inline si
     sarebbe spezzato. */
  el.querySelectorAll('button[data-v]').forEach(b=>
    b.addEventListener('click', ()=>{
      /* La risposta si tinge subito del colore della squadra: fra
         venticinque telefoni uguali è l'unico modo per accorgersi,
         guardando quello del compagno, di stare giocando in due
         squadre e non venticinque volte da soli. Senza squadre
         resta la conferma neutra di sempre. */
      el.querySelectorAll('button[data-v]').forEach(x=>x.classList.remove('mia'));
      b.classList.add('mia');
      invia(b.dataset.v, String(b.querySelector('span:last-child').textContent));
    }));
  const i = document.getElementById('risposta');
  if(i){ i.focus(); i.addEventListener('keydown', e=>{ if(e.key === 'Enter') inviaTesto(); }); }
}

function schermataInviata(scelta){
  const nome = squadra === 'rossi' ? 'i rossi' : 'i blu';
  el.innerHTML = `
    <div class="cima"><span class="marchio">Idearca</span><span class="pill">${esc(codice)}</span></div>
    <h1>Fatto ✅</h1>
    ${scelta ? `<div class="mia-risposta"><span class="mr-et">La tua risposta${
        squadra ? ', per '+nome : ''}</span>${esc(String(scelta))}</div>` : ''}
    <div class="esito"><span class="emo">📨</span>${
      squadra ? 'È arrivata e vale per la tua squadra.' : 'La tua risposta è arrivata.'
    } Guarda lo schermo.<br>
      <span style="color:#5A5148;font-size:.9rem">Resta qui: quando comparirà la prossima domanda
      la vedrai automaticamente.</span></div>`;
}

/* ---------- rete ---------- */
/* Verifica che il codice esista davvero. Senza questo controllo
   chi sbaglia una cifra finisce sulla schermata d'attesa e resta
   lì tutta l'ora convinto di essere dentro: il database risponde
   con un elenco vuoto sia per un codice inesistente sia per un
   codice giusto senza domande proiettate. */
async function codiceEsiste(){
  try{
    const res = await fetch(SB_URL+'/rest/v1/rpc/menti_sessione_aperta', {
      method:'POST', headers:intest(), body: JSON.stringify({p_codice: codice})
    });
    if(res.status === 404) return 'sconosciuto';   // funzione non ancora installata
    if(!res.ok) return 'sconosciuto';
    return (await res.json()) === true;
  }catch(_){ return 'sconosciuto'; }
}

/* Due porte d'ingresso: il modulo, e il codice gia' scritto
   nell'indirizzo quando si arriva dal QR. Prima erano la stessa
   funzione, che cercava subito il campo del modulo: arrivando dal
   QR quel campo non esiste ancora, la funzione usciva e la pagina
   restava bianca. */
async function entra(){
  const campo = document.getElementById('c');
  if(!campo){ return entraCon(codice); }
  const v = campo.value.trim();
  if(!v){ schermataCodice('Scrivi il codice.'); return; }
  return entraCon(v);
}

async function entraCon(v){
  if(!v){ schermataCodice(); return; }
  codice = v;
  const esiste = await codiceEsiste();
  if(esiste === false){
    schermataCodice('Codice non valido. Controlla le cifre proiettate sullo schermo.');
    return;
  }
  const d = await chiediDomanda();
  if(d && d.guasto){
    schermataCodice('Non riesco a contattare il server (' + d.guasto + '). Riprova fra un momento.');
    return;
  }
  history.replaceState(null,'', '?c='+encodeURIComponent(codice));
  aggiorna(d);
  avviaOrologio();
}

/* Tre esiti distinti, e vanno tenuti separati: prima un guasto di
   rete veniva mostrato come «codice non valido», e questo ha
   nascosto per giorni una chiave dell'API sbagliata. */
async function chiediDomanda(){
  try{
    const res = await fetch(SB_URL+'/rest/v1/rpc/menti_domanda_attiva', {
      method:'POST', headers:intest(), body: JSON.stringify({p_codice: codice})
    });
    if(!res.ok) return {guasto: res.status};
    const righe = await res.json();
    return Array.isArray(righe) && righe.length ? righe[0] : undefined;   // undefined = nessuna domanda ora
  }catch(_){ return {guasto: 'rete'}; }
}

function aggiorna(d){
  if(d === undefined || d === null){ if(!domanda) schermataAttesa(); return; }
  if(domanda && d.domanda_id === domanda.domanda_id) return;   // stessa domanda, non ridisegnare
  domanda = d;
  giaRisposto = haGiaRisposto(d.domanda_id);
  if(giaRisposto) schermataInviata(); else schermataDomanda(d);
}

function avviaOrologio(){
  if(orologio) clearInterval(orologio);
  orologio = setInterval(async ()=>{
    const d = await chiediDomanda();
    if(d && d.guasto) return;
    if(d === undefined){
      if(domanda){ domanda = null; schermataAttesa(); }
      return;
    }
    aggiorna(d);
  }, 2500);
}

function inviaTesto(){
  const i = document.getElementById('risposta');
  const v = (i.value || '').trim();
  if(!v){ document.getElementById('err').textContent = 'Scrivi qualcosa.'; return; }
  invia(v);
}

/* ---------- la squadra ----------
   Si chiede una volta sola, la prima volta che serve. Il server
   bilancia i due gruppi: chi ricarica la pagina non cambia colore. */
async function chiediSquadra(){
  if(squadra) return squadra;
  try{
    const res = await fetch(SB_URL+'/rest/v1/rpc/menti_assegna_squadra', {
      method:'POST', headers:intest(), body: JSON.stringify({p_codice: codice})
    });
    if(!res.ok) return null;
    const s = await res.json();
    if(s === 'rossi' || s === 'blu'){
      squadra = s;
      try{ sessionStorage.setItem('menti-squadra-'+codice, s); }catch(e){}
      mostraSquadra();
      return s;
    }
  }catch(e){}
  return null;
}

function mostraSquadra(){
  if(!squadra) return;
  document.body.setAttribute('data-squadra', squadra);
  let f = document.getElementById('fascia-squadra');
  if(!f){
    f = document.createElement('div');
    f.id = 'fascia-squadra';
    document.body.appendChild(f);
  }
  f.textContent = squadra === 'rossi' ? 'Squadra rossa' : 'Squadra blu';
}

async function invia(valore, etichetta){
  if(!domanda || giaRisposto) return;
  giaRisposto = true;
  try{
    /* se la sessione è a squadre passo dalla funzione nuova,
       altrimenti resta quella di sempre */
    const sq = await chiediSquadra();
    const res = sq
      ? await fetch(SB_URL+'/rest/v1/rpc/menti_vota_squadra', {
          method:'POST', headers:intest(),
          body: JSON.stringify({p_codice: codice, p_domanda: domanda.domanda_id,
                                p_valore: valore, p_squadra: sq})
        })
      : await fetch(SB_URL+'/rest/v1/rpc/menti_vota', {
          method:'POST', headers:intest(),
          body: JSON.stringify({p_codice: codice, p_domanda: domanda.domanda_id, p_valore: valore})
        });
    const ok = res.ok && (await res.json()) === true;
    if(ok){ segnaRisposta(domanda.domanda_id); schermataInviata(etichetta || valore); }
    else{
      giaRisposto = false;
      const e = document.getElementById('err');
      if(e) e.textContent = 'La domanda è stata chiusa: aspetta la prossima.';
    }
  }catch(err){
    giaRisposto = false;
    const e = document.getElementById('err');
    if(e) e.textContent = 'Errore di rete, riprova.';
  }
}

/* ---------- avvio ----------
   Qualunque cosa vada storta, si mostra il modulo del codice: una
   pagina bianca non lascia allo studente nemmeno un appiglio. */
(async function(){
  try{
    if(squadra) mostraSquadra();
    if(codice) await entraCon(codice);
    else schermataCodice();
  }catch(e){
    schermataCodice('Qualcosa non ha funzionato. Prova a digitare il codice.');
  }
  if(!document.getElementById('foglio').innerHTML.trim()) schermataCodice();
})();
</script>
</body>
</html>
